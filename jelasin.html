<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjelas Gambar Massal</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px 100px 10px; /* Padding bawah ekstra untuk menu melayang */
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 { margin: 0 0 10px 0; font-size: 1.5rem; }
        p.desc { margin: 0 0 20px 0; font-size: 0.95rem; color: #64748b; line-height: 1.5; }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            touch-action: manipulation;
        }

        .btn:active { background-color: var(--primary-hover); }
        input[type="file"] { display: none; }

        /* Galeri Gambar */
        #gallery {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .image-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-card canvas {
            max-width: 100%;
            height: auto;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), 
                              linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #f1f5f9 75%), 
                              linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .btn-small {
            background-color: #f8fafc;
            color: var(--primary);
            border: 1px solid #cbd5e1;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Menu Melayang di Bawah untuk Mobile */
        .sticky-controls {
            display: none; /* Disembunyikan sampai ada gambar */
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 100;
            flex-direction: column;
            gap: 15px;
        }

        .slider-container label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="range"] { width: 100%; margin: 0; }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h2>Penjelas Gambar</h2>
            <p class="desc">Unggah banyak gambar sekaligus. Transparansi tetap aman.</p>
            <!-- Atribut 'multiple' ditambahkan di sini -->
            <button class="btn" onclick="document.getElementById('fileInput').click()">Pilih Gambar</button>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div id="gallery"></div>
    </div>

    <!-- Kontrol Melayang -->
    <div class="sticky-controls" id="stickyControls">
        <div class="slider-container">
            <label for="threshold">
                Toleransi Hitam
                <span id="threshVal">200</span>
            </label>
            <input type="range" id="threshold" min="0" max="255" value="200">
        </div>
        <div class="action-buttons">
            <button class="btn" id="downloadAllBtn" style="background-color: #10b981;">Unduh Semua</button>
            <button class="btn" style="background-color: #ef4444;" onclick="resetAll()">Reset</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const stickyControls = document.getElementById('stickyControls');
        const thresholdSlider = document.getElementById('threshold');
        const threshVal = document.getElementById('threshVal');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        let imageList = []; // Menyimpan data gambar asli
        let processTimeout;

        // Handler saat file dipilih
        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const fileData = {
                            id: 'img_' + Date.now() + Math.floor(Math.random() * 1000),
                            name: file.name.replace(/\.[^/.]+$/, "") + "-jelas.png",
                            element: img
                        };
                        imageList.push(fileData);
                        createImageCard(fileData);
                        updateUI();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            });
            // Reset input agar bisa pilih file yang sama lagi jika butuh
            fileInput.value = ''; 
        });

        // Membuat UI untuk setiap gambar
        function createImageCard(fileData) {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.id = fileData.id;

            const canvas = document.createElement('canvas');
            canvas.width = fileData.element.width;
            canvas.height = fileData.element.height;
            
            const btnDownload = document.createElement('button');
            btnDownload.className = 'btn-small';
            btnDownload.textContent = 'Unduh Gambar Ini';
            btnDownload.onclick = () => downloadSingle(canvas, fileData.name);

            card.appendChild(canvas);
            card.appendChild(btnDownload);
            gallery.appendChild(card);

            // Langsung proses gambar saat dimuat
            processImage(fileData.element, canvas, parseInt(thresholdSlider.value));
        }

        // Fungsi memproses 1 gambar
        function processImage(imgElement, canvas, threshold) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true }); // Optimasi performa
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(imgElement, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];

                if (a < 10) continue; 

                const brightness = (r * 0.299) + (g * 0.587) + (b * 0.114);

                if (brightness >= threshold) {
                    data[i] = 255; data[i + 1] = 255; data[i + 2] = 255;
                } else {
                    data[i] = 0; data[i + 1] = 0; data[i + 2] = 0;
                }
                data[i + 3] = 255; 
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // Proses ulang semua gambar (Dipicu oleh slider)
        function processAll() {
            const threshold = parseInt(thresholdSlider.value);
            imageList.forEach(fileData => {
                const card = document.getElementById(fileData.id);
                const canvas = card.querySelector('canvas');
                processImage(fileData.element, canvas, threshold);
            });
        }

        // Slider event dengan Debounce agar tidak lag di mobile
        thresholdSlider.addEventListener('input', function() {
            threshVal.textContent = this.value;
            clearTimeout(processTimeout);
            processTimeout = setTimeout(() => {
                processAll();
            }, 100); // Tunggu 100ms setelah user berhenti geser sebelum diproses
        });

        // Download Individual
        function downloadSingle(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Download Massal (Berurutan dengan jeda)
        downloadAllBtn.addEventListener('click', function() {
            let delay = 0;
            imageList.forEach((fileData, index) => {
                setTimeout(() => {
                    const card = document.getElementById(fileData.id);
                    const canvas = card.querySelector('canvas');
                    downloadSingle(canvas, fileData.name);
                }, delay);
                delay += 300; // Jeda 300ms antar unduhan agar tidak diblokir browser
            });
        });

        // Menampilkan/Menyembunyikan menu melayang
        function updateUI() {
            if (imageList.length > 0) {
                stickyControls.style.display = 'flex';
            } else {
                stickyControls.style.display = 'none';
            }
        }

        // Reset semua
        function resetAll() {
            gallery.innerHTML = '';
            imageList = [];
            updateUI();
        }
    </script>
</body>
</html>

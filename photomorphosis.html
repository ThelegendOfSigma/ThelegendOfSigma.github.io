<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bikinapa?</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
@font-face { font-family: 'FontSatu'; src: url('font_1.otf') format('opentype'); font-weight: normal; font-style: normal; }
@font-face { font-family: 'FontDua'; src: url('font_2.otf') format('opentype'); font-weight: normal; font-style: normal; }
body { background: #74b9ff; background-image: radial-gradient(#0984e3 2px, transparent 2px); background-size: 30px 30px; font-family: 'FontDua', 'Nunito', 'Comic Sans MS', cursive, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; margin: 0; overflow: hidden; color: #2d3436; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.app-container { container-type: inline-size; position: relative; width: 100%; max-width: 480px; background: #ffffff; border: 4px solid #2d3436; border-radius: 24px; display: flex; flex-direction: column; z-index: 1; box-shadow: 8px 8px 0px rgba(45, 52, 54, 1); max-height: 95vh; overflow-y: auto; }
.title-bar, .phase-subtitle, .slot-label, h3, .result-material-text { font-family: 'FontSatu', 'Nunito', sans-serif; }
.title-bar { background: #ff7675; color: #fff; padding: 12px 20px; font-size: clamp(1.1rem, 5cqw, 1.5rem); display: flex; justify-content: space-between; align-items: center; letter-spacing: 1px; border-bottom: 4px solid #2d3436; border-radius: 20px 20px 0 0; }
.title-bar-btn { background: #ffeaa7; border: 3px solid #2d3436; border-radius: 50%; width: 32px; height: 32px; font-size: clamp(0.8rem, 4cqw, 1.1rem); display: flex; justify-content: center; align-items: center; cursor: pointer; color: #2d3436; transition: transform 0.1s; box-shadow: 2px 2px 0px #2d3436; }
.title-bar-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #2d3436; }
.menu-bar { display: flex; justify-content: flex-end; padding: 10px 20px; border-bottom: 4px solid #2d3436; background: #81ecec; font-size: clamp(0.9rem, 3.5cqw, 1.1rem); }
.menu-item { cursor: pointer; padding: 6px 16px; background: #fff; border: 3px solid #2d3436; border-radius: 12px; box-shadow: 3px 3px 0px #2d3436; transition: all 0.1s ease; }
.menu-item:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #2d3436; }
.content-area { padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
.phase-subtitle { color: #2d3436; background: #ffeaa7; padding: 8px 30px; border: 3px solid #2d3436; border-radius: 20px; font-size: clamp(1.2rem, 5.5cqw, 1.6rem); text-transform: uppercase; text-align: center; box-shadow: 4px 4px 0px #2d3436; }
.slot-machine-container { display: flex; gap: 12px; background: #f1f2f6; padding: 16px; border: 4px solid #2d3436; border-radius: 20px; box-shadow: inset 0px 6px 0px rgba(0,0,0,0.1), 4px 4px 0px #2d3436; width: 100%; justify-content: space-between; }
.slot-column { flex: 1; display: flex; flex-direction: column; gap: 10px; align-items: center; container-type: inline-size; }
.slot-label { border: 3px solid #2d3436; border-radius: 12px; font-size: clamp(0.8rem, 15cqw, 1.2rem); padding: 6px 10px; text-align: center; width: 100%; box-shadow: 2px 2px 0px #2d3436; letter-spacing: 0.5px; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s; }
.slot-label.highlight-pop { transform: scale(1.15); background: #fdcb6e !important; color: #2d3436 !important; }
.slot-label.highlight-gold { transform: scale(1); background: #fdcb6e !important; color: #2d3436 !important; }
.slot-window { width: 100%; height: 120px; background: #fff; border: 4px solid #2d3436; border-radius: 12px; overflow: hidden; position: relative; box-shadow: inset 0px 4px 8px rgba(0,0,0,0.15); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s; }
.slot-window.highlight-pop { transform: scale(1.05); background: #fdcb6e !important; }
.slot-window.highlight-gold { transform: scale(1); background: #fdcb6e !important; }
.slot-window::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 25px; background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent); z-index: 5; }
.slot-window::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 25px; background: linear-gradient(to top, rgba(0,0,0,0.2), transparent); z-index: 5; }
.slot-strip { display: flex; flex-direction: column; width: 100%; }
.slot-item { height: 120px; display: flex; justify-content: center; align-items: center; font-size: clamp(1.5rem, 25cqw, 2.5rem); color: #2d3436; text-align: center; padding: 0 4px; }
.slot-item img { height: 65px; width: auto; filter: drop-shadow(3px 3px 0px rgba(45, 52, 54, 0.2)); }
.material-text-fit { display: inline-block; white-space: normal; word-break: break-word; font-size: clamp(1rem, 24cqw, 2.2rem); line-height: 1.1; font-weight: 900; -webkit-text-stroke: 1px #2d3436; width: 100%; }
.btn-action { background: #fdcb6e; color: #2d3436; font-family: 'FontDua', sans-serif; font-size: clamp(1.2rem, 6cqw, 1.6rem); border: 4px solid #2d3436; border-radius: 16px; padding: 16px 24px; cursor: pointer; width: 100%; transition: all 0.1s ease; box-shadow: 4px 6px 0px #2d3436; text-transform: uppercase; }
.btn-action:active:not(:disabled) { transform: translateY(6px); box-shadow: 0px 0px 0px #2d3436; }
.btn-action:disabled { background: #dfe6e9; color: #b2bec3; cursor: not-allowed; box-shadow: 4px 6px 0px #b2bec3; border-color: #b2bec3;}
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(45,52,54,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(3px); }
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-window { container-type: inline-size; background: #fff; border: 4px solid #2d3436; border-radius: 24px; width: 90%; max-width: 380px; display: flex; flex-direction: column; box-shadow: 8px 8px 0px #2d3436; overflow: hidden; transform: scale(0.9); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.modal-overlay.active .modal-window { transform: scale(1); }
.modal-content { padding: 25px; text-align: center; display: flex; flex-direction: column; gap: 20px; }
h3 { margin: 0; font-size: clamp(1.1rem, 6cqw, 1.4rem); color: #2d3436; }
.result-box-custom { container-type: inline-size; background: #ffeaa7; border: 3px dashed #2d3436; border-radius: 16px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; overflow: hidden; }
.result-icons-container { display: flex; justify-content: center; gap: 20px; }
.result-icons-container img { height: 70px; width: auto; filter: drop-shadow(4px 4px 0px rgba(45, 52, 54, 0.3)); }
.result-material-text { text-transform: uppercase; white-space: normal; word-break: break-word; font-size: clamp(1.5rem, 14cqw, 2.5rem); line-height: 1.2; width: 100%; text-align: center; font-weight: 900; -webkit-text-stroke: 1px #2d3436; }
.history-list-container { background: #f1f2f6; border: 3px solid #2d3436; border-radius: 12px; padding: 15px; max-height: 250px; overflow-y: auto; text-align: left; font-size: clamp(0.9rem, 4cqw, 1.1rem); }
.history-list-container ul { list-style: none; padding-left: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.history-list-container li { background: #fff; border: 2px solid #dfe6e9; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.history-item-content { display: flex; align-items: center; gap: 8px; flex-grow: 1; word-break: break-word; flex-wrap: wrap;}
.history-item-content img { height: 24px; width: auto; vertical-align: middle; }
.btn-del-history { background: #ff7675; color: #fff; border: 2px solid #2d3436; border-radius: 6px; width: 28px; height: 28px; font-size: clamp(0.8rem, 3cqw, 1rem); cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
.btn-del-history:active { transform: scale(0.9); }
</style>
</head>
<body>
<div class="app-container">
    <div class="title-bar"><span>Bikinapa?</span></div>
    <div class="menu-bar"><div class="menu-item" id="btn-show-history">📜 Riwayat</div></div>
    <div class="content-area">
        <div class="phase-subtitle">T.O.E.I.C</div>
        <div class="slot-machine-container">
            <div class="slot-column">
                <div class="slot-label" id="label-role" style="background:#ff7675; color:#fff;">Role</div>
                <div class="slot-window" id="window-role"><div class="slot-strip" id="strip-role"><div class="slot-item">???</div></div></div>
            </div>
            <div class="slot-column">
                <div class="slot-label" id="label-gender" style="background:#74b9ff; color:#fff;">Gender</div>
                <div class="slot-window" id="window-gender"><div class="slot-strip" id="strip-gender"><div class="slot-item">???</div></div></div>
            </div>
            <div class="slot-column">
                <div class="slot-label" id="label-material" style="background:#55efc4; color:#2d3436;">Material</div>
                <div class="slot-window" id="window-material"><div class="slot-strip" id="strip-material"><div class="slot-item">???</div></div></div>
            </div>
        </div>
        <button class="btn-action" id="btn-main">Mulai</button>
    </div>
</div>
<div class="modal-overlay" id="modal-result">
    <div class="modal-window">
        <div class="title-bar" style="background: #a29bfe;"><span>Ini hasilnya</span><div class="title-bar-btn" id="btn-close-result-x">X</div></div>
        <div class="modal-content">
            <h3>Kombinasi Terpilih</h3>
            <div class="result-box-custom" id="result-content"></div>
            <button class="btn-action" id="btn-restart" style="background:#a29bfe; color:#fff;">Tutup</button>
        </div>
    </div>
</div>
<div class="modal-overlay" id="modal-history">
    <div class="modal-window">
        <div class="title-bar" style="background: #00cec9;"><span>Riwayat</span><div class="title-bar-btn" id="btn-close-history-x">X</div></div>
        <div class="modal-content">
            <div class="history-list-container"><ul id="history-list"></ul></div>
            <button class="btn-action" id="btn-close-history" style="background:#00cec9; color:#fff;">Tutup</button>
        </div>
    </div>
</div>
<script>
const sfxType = new Audio('audio/type.mp3'); sfxType.loop = true;
const sfxGet = new Audio('audio/get.mp3'); sfxGet.preload = 'auto';
const sfxAkh = new Audio('audio/akh.mp3'); sfxAkh.preload = 'auto';
const playSfxGet = () => { sfxGet.currentTime = 0; sfxGet.play().catch(e=>e); };
const playSfxAkh = () => { sfxAkh.currentTime = 0; sfxAkh.play().catch(e=>e); };
const imageMap = {"Fighter": "role_fg.png", "Marksman": "role_mm.png", "Assassin": "role_as.png", "Mage": "role_mg.png", "Tank": "role_tn.png", "Male": "gender_male.png", "Female": "gender_female.png"};
let roles = [{l:"Assassin",w:1},{l:"Mage",w:1},{l:"Fighter",w:1},{l:"Tank",w:1},{l:"Marksman",w:1}];
let genders = [{l:"Male",w:1},{l:"Female",w:1}];
let materials = [{l:"Mobil",w:1},{l:"Semangka",w:1},{l:"Pensil",w:1},{l:"Gitar Listrik",w:1}].map(m => ({...m, color: `hsl(${Math.floor(Math.random()*360)}, 100%, 70%)`}));
let historyData = JSON.parse(localStorage.getItem('slotHistory')) || [];
let usedCombinations = JSON.parse(localStorage.getItem('usedSlotCombos')) || []; 
let isSpinning = false;
const btnMain = document.getElementById('btn-main'), modalResult = document.getElementById('modal-result'), modalHistory = document.getElementById('modal-history'), historyList = document.getElementById('history-list');
const getMatColor = (t) => { const f = materials.find(m => m.l === t); return f && f.color ? f.color : `hsl(${Math.floor(Math.random()*360)}, 100%, 70%)`; };
const formatDisplayItem = (txt) => imageMap[txt] ? `<img src="${imageMap[txt]}" alt="${txt}" title="${txt}" onerror="this.outerHTML='${txt}'">` : `<span class="material-text-fit" style="color:${getMatColor(txt)};">${txt}</span>`;
const renderHistory = () => { historyList.innerHTML = !historyData.length ? "<li>Belum ada riwayat.</li>" : historyData.map((item, idx) => `<li><span class="history-item-content">${item.split(' - ').map(p => formatDisplayItem(p)).join(' <span style="color:#b2bec3;">+</span> ')}</span><button class="btn-del-history" onclick="deleteHistoryItem(${idx})">✕</button></li>`).join(''); };
window.deleteHistoryItem = (index) => { historyData.splice(index, 1); localStorage.setItem('slotHistory', JSON.stringify(historyData)); renderHistory(); };
const saveToHistory = (comboStr) => { historyData.unshift(comboStr); if(historyData.length > 20) historyData.pop(); localStorage.setItem('slotHistory', JSON.stringify(historyData)); usedCombinations.push(comboStr); localStorage.setItem('usedSlotCombos', JSON.stringify(usedCombinations)); renderHistory(); };
const getRandomItem = (arr) => { let r = Math.random() * arr.reduce((s, i) => s + (Number(i.w) || 1), 0); for(let i=0; i<arr.length; i++) { r -= (Number(arr[i].w) || 1); if(r <= 0) return arr[i].l; } return arr[arr.length - 1].l; };
const buildSlotStrip = (id, arr, target) => { const s = document.getElementById(id); s.style.transition = 'none'; s.style.transform = 'translateY(0)'; s.innerHTML = ''; const items = Array.from({length:30}, () => arr[Math.floor(Math.random() * arr.length)].l).concat(target); items.forEach(i => { const d = document.createElement('div'); d.className = 'slot-item'; d.innerHTML = formatDisplayItem(i); s.appendChild(d); }); void s.offsetWidth; return items.length; };
const triggerHighlight = (lbl, win) => { playSfxGet(); lbl.classList.add('highlight-pop'); win.classList.add('highlight-pop'); setTimeout(() => { lbl.classList.remove('highlight-pop'); win.classList.remove('highlight-pop'); lbl.classList.add('highlight-gold'); win.classList.add('highlight-gold'); }, 700); };
btnMain.addEventListener('click', () => { 
    if(isSpinning) return; 
    const tR = getRandomItem(roles), tG = getRandomItem(genders), aM = materials.filter(m => !usedCombinations.includes(`${tR} - ${tG} - ${m.l}`));
    if(!aM.length) return alert(`Oops! Semua kombinasi material untuk ${tR} & ${tG} sudah habis. Silakan hapus riwayat untuk mengulang.`);
    const tM = getRandomItem(aM);
    isSpinning = true; btnMain.disabled = true; btnMain.innerText = "Memproses...";
    sfxType.currentTime = 0; sfxType.play().catch(e=>e);
    const lR = buildSlotStrip('strip-role', roles, tR), lG = buildSlotStrip('strip-gender', genders, tG), lM = buildSlotStrip('strip-material', materials, tM), iH = 120; 
    const sR = document.getElementById('strip-role'), sG = document.getElementById('strip-gender'), sMat = document.getElementById('strip-material');
    sR.style.transition = 'transform 3s cubic-bezier(0.15, 0.8, 0.15, 1)'; sG.style.transition = 'transform 3.5s cubic-bezier(0.15, 0.8, 0.15, 1)'; sMat.style.transition = 'transform 4s cubic-bezier(0.15, 0.8, 0.15, 1)';
    sR.style.transform = `translateY(-${(lR - 1) * iH}px)`; sG.style.transform = `translateY(-${(lG - 1) * iH}px)`; sMat.style.transform = `translateY(-${(lM - 1) * iH}px)`;
    const lblR = document.getElementById('label-role'), lblG = document.getElementById('label-gender'), lblM = document.getElementById('label-material');
    const winR = document.getElementById('window-role'), winG = document.getElementById('window-gender'), winM = document.getElementById('window-material');
    lblR.classList.remove('highlight-pop', 'highlight-gold'); winR.classList.remove('highlight-pop', 'highlight-gold');
    lblG.classList.remove('highlight-pop', 'highlight-gold'); winG.classList.remove('highlight-pop', 'highlight-gold');
    lblM.classList.remove('highlight-pop', 'highlight-gold'); winM.classList.remove('highlight-pop', 'highlight-gold');
    setTimeout(() => triggerHighlight(lblR, winR), 3000); setTimeout(() => triggerHighlight(lblG, winG), 3500); setTimeout(() => triggerHighlight(lblM, winM), 4000);
    setTimeout(() => { sfxType.pause(); playSfxAkh(); confetti({particleCount: 200, spread: 100, origin: {y: 0.6}}); document.getElementById('result-content').innerHTML = `<div class="result-icons-container">${formatDisplayItem(tR)}${formatDisplayItem(tG)}</div><div class="result-material-text" style="color:${getMatColor(tM)};">${tM}</div>`; saveToHistory(`${tR} - ${tG} - ${tM}`); modalResult.classList.add('active'); isSpinning = false; btnMain.disabled = false; btnMain.innerText = "Mulai"; }, 5500); 
});
document.getElementById('btn-show-history').addEventListener('click', () => { renderHistory(); modalHistory.classList.add('active'); });
document.getElementById('btn-close-history').addEventListener('click', () => modalHistory.classList.remove('active'));
document.getElementById('btn-close-history-x').addEventListener('click', () => modalHistory.classList.remove('active'));
document.getElementById('btn-restart').addEventListener('click', () => modalResult.classList.remove('active'));
document.getElementById('btn-close-result-x').addEventListener('click', () => modalResult.classList.remove('active'));
window.onload = () => { renderHistory(); btnMain.disabled = true; btnMain.innerText = "Memuat..."; fetch('material.json').then(r => r.json()).then(d => { if(Array.isArray(d) && d.length > 0) materials = d.map(i => { let m = typeof i === 'string' ? {l:i, w:1} : i; m.color = m.color || `hsl(${Math.floor(Math.random()*360)}, 100%, 70%)`; return m; }); }).catch(() => {}).finally(() => { btnMain.disabled = false; btnMain.innerText = "Mulai"; }); };
</script>
</body>
</html>

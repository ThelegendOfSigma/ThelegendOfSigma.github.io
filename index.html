<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Avatar Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root {
    --bg-main: #f0f2f5;
    --surface: #ffffff;
    --text-dark: #1c1e21;
    --text-muted: #65676b;
    --border: #e4e6eb;
    --primary: #1877f2;
    --primary-hover: #166fe5;
    --secondary: #e4e6eb;
    --secondary-hover: #d8dadf;
    --radius-lg: 24px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  * { 
    box-sizing: border-box; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; 
    padding: 0; 
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none; 
  }

  input[type="text"], input[type="number"] {
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
  }

  body {
    background-color: var(--bg-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* --- Loading Overlay Styles --- */
  .loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-main);
    z-index: 1000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .loading-box {
    width: 80%; max-width: 280px;
  }
  .loading-text {
    font-size: 15px; font-weight: 700; color: var(--text-dark);
    text-align: center; margin-bottom: 14px;
  }
  .loading-bar-bg {
    width: 100%; height: 8px; background: var(--secondary);
    border-radius: 20px; overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%; width: 0%; background: var(--primary);
    border-radius: 20px; transition: width 0.15s ease-out;
  }

  /* --- App Styles --- */
  .app-card {
    background: var(--surface);
    width: 100%;
    max-width: 420px;
    border-radius: var(--radius-lg);
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    text-align: center;
    padding: 24px 20px 10px;
  }

  .app-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: -0.5px;
  }

  .canvas-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  .canvas-wrapper {
    width: 180px;
    height: 180px;
    border-radius: var(--radius-md); /* Diubah menjadi kotak dengan sudut tumpul modern */
    background: var(--bg-main);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1) inset, 0 0 0 4px var(--surface), 0 0 0 6px var(--border);
    margin-bottom: 16px;
  }
  
  canvas {
    width: 100%; /* Dikembalikan ke 100% agar pas pada kotak */
    height: auto;
    display: block;
    image-rendering: pixelated;
    pointer-events: none;
  }

  .username-display {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 4px;
  }

  .status-badge {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-main);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 500;
  }

  .controls-section {
    padding: 0 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .input-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .input-field {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 500;
    outline: none;
    color: var(--text-dark);
    transition: all 0.2s ease;
  }

  .input-field:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.15);
  }

  .action-row {
    display: flex;
    gap: 12px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-md);
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:active { background: var(--primary-hover); transform: scale(0.98); }

  .btn-secondary {
    background: var(--secondary);
    color: var(--text-dark);
  }
  .btn-secondary:active { background: var(--secondary-hover); transform: scale(0.98); }

  .batch-box {
    background: #f8f9fa;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
  }

  .stepper {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    height: 40px;
    margin-bottom: 12px;
  }

  .stepper button {
    width: 40px;
    height: 100%;
    background: var(--secondary);
    border: none;
    font-size: 18px;
    font-weight: bold;
    color: var(--text-dark);
    cursor: pointer;
  }
  .stepper button:active { background: var(--secondary-hover); }

  .stepper input {
    flex: 1;
    height: 100%;
    border: none;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dark);
    pointer-events: none;
  }

  /* Modal Preview */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  
  .modal-overlay.active {
    opacity: 1;
    display: flex;
  }

  .modal-content {
    background: var(--surface);
    width: 100%;
    max-width: 400px;
    border-radius: var(--radius-lg);
    padding: 24px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    transform: translateY(20px);
    transition: transform 0.3s ease;
  }

  .modal-overlay.active .modal-content {
    transform: translateY(0);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .modal-title { font-size: 18px; font-weight: 700; color: var(--text-dark); }
  
  .close-btn { 
    background: var(--secondary); 
    border: none; 
    width: 32px; 
    height: 32px; 
    border-radius: 50%; 
    font-size: 18px; 
    cursor: pointer; 
    color: var(--text-dark);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 12px;
    max-height: 50vh;
    overflow-y: auto;
    margin-bottom: 20px;
    padding-right: 4px;
  }

  .preview-grid img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: var(--radius-sm); /* Kotak */
    object-fit: cover;
    border: 2px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

</style>
</head>
<body>

<!-- Layar Loading -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-box">
    <div class="loading-text" id="loadingText">Menyiapkan Studio... 0%</div>
    <div class="loading-bar-bg">
      <div class="loading-bar-fill" id="loadingBar"></div>
    </div>
  </div>
</div>

<div class="app-card">
  <div class="app-header">
    <div class="app-title">Avatar Studio</div>
  </div>

  <div class="canvas-section">
    <div class="canvas-wrapper">
      <canvas id="canvas" width="256" height="256"></canvas>
    </div>
    <div class="username-display" id="displayUsername">@memuat...</div>
    <div class="status-badge" id="statusInfo">Menyiapkan aset...</div>
  </div>

  <div class="controls-section">
    <div class="input-group">
      <label class="input-label">Identifier (Seed)</label>
      <input type="text" id="seedInput" class="input-field" placeholder="Ketik nama atau ID..." autocomplete="off">
    </div>

    <div class="action-row">
      <button class="btn btn-secondary" onclick="generateRandom()">Acak</button>
      <button class="btn btn-secondary" onclick="downloadImage()">Simpan (JPG)</button>
    </div>

    <div class="batch-box">
      <label class="input-label" style="display:block; margin-bottom: 10px;">Mode Batch (Maks 10)</label>
      <div class="stepper">
        <button type="button" onclick="updateBatchCount(-1)">-</button>
        <input type="number" id="batchCount" value="5" min="2" max="10" readonly>
        <button type="button" onclick="updateBatchCount(1)">+</button>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="prepareBatch()">Lihat Preview & Download ZIP</button>
    </div>
  </div>
</div>

<!-- Modal Pratinjau Batch -->
<div class="modal-overlay" id="previewModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Pratinjau Batch</div>
      <button class="close-btn" onclick="closePreview()">&times;</button>
    </div>
    <div class="preview-grid" id="previewGrid"></div>
    <button class="btn btn-primary" id="btnDownloadZip" onclick="downloadBatchZip()" style="width: 100%;">
      Mulai Download ZIP
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const seedInput = document.getElementById("seedInput");
const displayUsername = document.getElementById("displayUsername");
const statusInfo = document.getElementById("statusInfo");

// Kanvas rahasia untuk memproses warna & bentuk
const offCanvas = document.createElement("canvas");
offCanvas.width = 256;
offCanvas.height = 256;
const offCtx = offCanvas.getContext("2d");

const TOTAL_TEXTURES = 29;
let loadedTextures = [];
let loadedParts = { body: [], eyes_male: [], eyes_female: [], hair_b: [], hair_f_female: [], hair_f_male: [], head: [], mouth: [] };

// Daftar file (Dibuat otomatis agar lebih rapi)
const assetList = {
  body: Array.from({length: 12}, (_, i) => `body/body_${String(i+1).padStart(2, '0')}.png`),
  eyes_male: Array.from({length: 30}, (_, i) => `eyes_male/eyes_${String(i+1).padStart(2, '0')}.png`),
  eyes_female: Array.from({length: 34}, (_, i) => `eyes_female/eyes_${String(i+1).padStart(2, '0')}.png`),
  hair_b: Array.from({length: 7}, (_, i) => `hair_b/hrb_${String(i+1).padStart(2, '0')}.png`),
  hair_f_female: Array.from({length: 17}, (_, i) => `hair_f/female/hrf_${String(i+1).padStart(2, '0')}.png`),
  hair_f_male: Array.from({length: 13}, (_, i) => `hair_f/male/hrf_${String(i+1).padStart(2, '0')}.png`),
  head: ['head/head.png'],
  mouth: Array.from({length: 31}, (_, i) => `mouth/mouth_${String(i+1).padStart(2, '0')}.png`)
};

const loadImg = (url) => new Promise((resolve) => { 
  const img = new Image(); 
  img.onload = () => resolve(img); 
  img.onerror = () => {
    const canvasFallback = document.createElement("canvas");
    canvasFallback.width = 256; canvasFallback.height = 256;
    resolve(canvasFallback);
  };
  img.src = url; 
});

async function loadAssets() {
  const loadingOverlay = document.getElementById("loadingOverlay");
  const loadingBar = document.getElementById("loadingBar");
  const loadingText = document.getElementById("loadingText");
  
  // Hitung total aset untuk persentase progress
  const totalAssets = TOTAL_TEXTURES + Object.values(assetList).flat().length;
  let loaded = 0;
  
  const updateProgress = () => {
    loaded++;
    const percent = Math.min(100, Math.floor((loaded / totalAssets) * 100));
    loadingBar.style.width = percent + "%";
    loadingText.textContent = `Menyiapkan Studio... ${percent}%`;
  };

  const loadWithProgress = async (url) => {
    const img = await loadImg(url);
    updateProgress();
    return img;
  };

  // Muat tekstur secara paralel
  const texturePromises = Array.from({length: TOTAL_TEXTURES}, (_, i) => {
    return loadWithProgress(`img_${String(i+1).padStart(2, '0')}.png`);
  });

  // Muat bagian avatar secara paralel
  const partPromises = {};
  for (const category in assetList) {
    partPromises[category] = Promise.all(assetList[category].map(loadWithProgress));
  }

  // Tunggu semua selesai
  const resolvedTextures = await Promise.all(texturePromises);
  loadedTextures = resolvedTextures.map(img => ctx.createPattern(img, "repeat"));

  for (const category in assetList) {
    loadedParts[category] = await partPromises[category];
  }

  // Sembunyikan loading dengan animasi
  setTimeout(() => {
    loadingOverlay.classList.add("hidden");
  }, 400);

  statusInfo.textContent = "Siap digunakan";
  statusInfo.style.background = "#e6f4ea";
  statusInfo.style.color = "#1e8e3e";
}

const palettes = {
  skin: [ { base: "#ffead1", dark: "#eac09d", blush: "#ffc4b8" }, { base: "#fde2cd", dark: "#d9ae87", blush: "#fba9a1" }, { base: "#e2b896", dark: "#bf8e6a", blush: "#d28174" }, { base: "#c8946e", dark: "#a36c4b", blush: "#a66155" }, { base: "#a8e6cf", dark: "#74c69d", blush: "#dcedc1" }, { base: "#cad2c5", dark: "#84a98c", blush: "#a3b18a" }, { base: "#9bf6ff", dark: "#48cae4", blush: "#caf0f8" }, { base: "#e0b1cb", dark: "#9f86c0", blush: "#f3d2c1" } ],
  themes: [ { main: "#1e293b", sec: "#0f172a", hair: "#111827", hDark: "#030712" }, { main: "#3b82f6", sec: "#1d4ed8", hair: "#3f2814", hDark: "#241408" }, { main: "#10b981", sec: "#047857", hair: "#d97706", hDark: "#b45309" }, { main: "#f43f5e", sec: "#be123c", hair: "#7e22ce", hDark: "#581c87" }, { main: "#f472b6", sec: "#db2777", hair: "#f59e0b", hDark: "#d97706" }, { main: "#fb923c", sec: "#c2410c", hair: "#475569", hDark: "#334155" }, { main: "#2dd4bf", sec: "#0f766e", hair: "#be185d", hDark: "#831843" }, { main: "#818cf8", sec: "#4f46e5", hair: "#e11d48", hDark: "#9f1239" } ]
};

function invertHexColor(hex) {
  hex = hex.replace('#', '');
  let r = (255 - parseInt(hex.substring(0, 2), 16)).toString(16).padStart(2, '0');
  let g = (255 - parseInt(hex.substring(2, 4), 16)).toString(16).padStart(2, '0');
  let b = (255 - parseInt(hex.substring(4, 6), 16)).toString(16).padStart(2, '0');
  return '#' + r + g + b;
}

class PRNG {
  constructor(seedStr) { this.seed = this.hashString(seedStr); }
  hashString(str) {
    let h = 2166136261;
    for(let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24); }
    return h >>> 0;
  }
  next() { this.seed = (this.seed * 1664525 + 1013904223) >>> 0; return this.seed / 4294967296; }
}

let currentConfig = {};
let currentSeedName = "";
let batchImagesData = [];

function drawPart(imgElement, color, texture = null) {
  if (!imgElement) return;
  offCtx.clearRect(0, 0, 256, 256);
  offCtx.globalCompositeOperation = 'source-over';
  offCtx.fillStyle = color || "#ffffff";
  offCtx.fillRect(0, 0, 256, 256);

  if (texture) {
    offCtx.fillStyle = texture;
    offCtx.globalAlpha = 0.55;
    offCtx.fillRect(0, 0, 256, 256);
    offCtx.globalAlpha = 1.0;
  }

  offCtx.globalCompositeOperation = 'destination-in';
  offCtx.drawImage(imgElement, 0, 0, 256, 256);
  offCtx.globalCompositeOperation = 'multiply';
  offCtx.drawImage(imgElement, 0, 0, 256, 256);
  ctx.drawImage(offCanvas, 0, 0, canvas.width, canvas.height);
}

function drawAvatar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const skin = palettes.skin[currentConfig.skinIdx];
  const theme = palettes.themes[currentConfig.themeIdx];
  const fabricTex = loadedTextures.length ? loadedTextures[currentConfig.texFabricIdx] : null;
  const hairTex = loadedTextures.length ? loadedTextures[currentConfig.texHairIdx] : null;
  const paperTex = loadedTextures.length ? loadedTextures[currentConfig.texPaperIdx] : null;

  const bgInvMain = invertHexColor(theme.main);
  const bgInvSec = invertHexColor(theme.sec);
  const bgGrd = ctx.createRadialGradient(128, 128, 0, 128, 128, 200);
  bgGrd.addColorStop(0, bgInvMain); bgGrd.addColorStop(1, bgInvSec);
  ctx.fillStyle = bgGrd; 
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  if (paperTex) {
    ctx.globalAlpha = 0.35; 
    ctx.fillStyle = paperTex; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1.0;
  }
  
  // Draw Layer secara berurutan
  if(currentConfig.hairBIdx !== -1 && loadedParts.hair_b[currentConfig.hairBIdx]) drawPart(loadedParts.hair_b[currentConfig.hairBIdx], theme.hDark, hairTex);
  if(loadedParts.head[0]) drawPart(loadedParts.head[0], skin.base);
  if(loadedParts.body[currentConfig.bodyIdx]) drawPart(loadedParts.body[currentConfig.bodyIdx], theme.main, fabricTex);
  
  // Render mata berdasarkan sistem gender
  if (currentConfig.isFemale) {
    if(loadedParts.eyes_female[currentConfig.eyeIdx]) drawPart(loadedParts.eyes_female[currentConfig.eyeIdx], "#ffffff");
  } else {
    if(loadedParts.eyes_male[currentConfig.eyeIdx]) drawPart(loadedParts.eyes_male[currentConfig.eyeIdx], "#ffffff");
  }

  if(loadedParts.mouth[currentConfig.mouthIdx]) drawPart(loadedParts.mouth[currentConfig.mouthIdx], "#ffffff");

  // Render rambut depan berdasarkan sistem gender
  if (currentConfig.isFemale) {
    if(loadedParts.hair_f_female[currentConfig.hairFIdx]) drawPart(loadedParts.hair_f_female[currentConfig.hairFIdx], theme.hair, hairTex);
  } else {
    if(loadedParts.hair_f_male[currentConfig.hairFIdx]) drawPart(loadedParts.hair_f_male[currentConfig.hairFIdx], theme.hair, hairTex);
  }

  displayUsername.textContent = `@${currentSeedName.toLowerCase()}`;
}

function applySeed(seedStr) {
  if (!seedStr) seedStr = "Anonim"; 
  currentSeedName = seedStr;
  if (document.activeElement !== seedInput) seedInput.value = seedStr; 
  
  const rng = new PRNG(seedStr);
  const isFemale = rng.next() > 0.5;
  let hairBIndex = -1, hairFIndex = 0, eyeIndex = 0;

  if (isFemale) {
    hairBIndex = Math.floor(rng.next() * Math.max(1, loadedParts.hair_b.length));
    hairFIndex = Math.floor(rng.next() * Math.max(1, loadedParts.hair_f_female.length));
    eyeIndex = Math.floor(rng.next() * Math.max(1, loadedParts.eyes_female.length));
  } else {
    hairFIndex = Math.floor(rng.next() * Math.max(1, loadedParts.hair_f_male.length));
    eyeIndex = Math.floor(rng.next() * Math.max(1, loadedParts.eyes_male.length));
  }

  currentConfig = {
    isFemale: isFemale, 
    skinIdx: Math.floor(rng.next() * palettes.skin.length),
    themeIdx: Math.floor(rng.next() * palettes.themes.length),
    bodyIdx: Math.floor(rng.next() * Math.max(1, loadedParts.body.length)),
    eyeIdx: eyeIndex,
    mouthIdx: Math.floor(rng.next() * Math.max(1, loadedParts.mouth.length)),
    hairBIdx: hairBIndex, hairFIdx: hairFIndex,
    texFabricIdx: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES)),
    texHairIdx: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES)),
    texPaperIdx: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES))
  };
  drawAvatar();
}

seedInput.addEventListener("input", (e) => applySeed(e.target.value));

function generateRandomName() {
  const kons = "bcdfghjklmnprstvwxyz", voks = "aeiou";
  let name = "";
  for(let i=0; i<6; i++) name += i%2===0 ? kons[Math.floor(Math.random()*kons.length)] : voks[Math.floor(Math.random()*voks.length)];
  return name.charAt(0).toUpperCase() + name.slice(1) + Math.floor(10+Math.random()*89);
}

function generateRandom() { applySeed(generateRandomName()); }

function getHDCanvasData() {
  const hdCanvas = document.createElement("canvas");
  hdCanvas.width = 1024; hdCanvas.height = 1024;
  const hdCtx = hdCanvas.getContext("2d");
  
  hdCtx.fillStyle = "#FFFFFF";
  hdCtx.fillRect(0, 0, 1024, 1024);
  hdCtx.imageSmoothingEnabled = false; 
  hdCtx.drawImage(canvas, 0, 0, 1024, 1024);
  
  // Tambahkan watermark ID Avatar kecil di pojok kanan bawah
  hdCtx.imageSmoothingEnabled = true; // Smoothing aktif khusus teks agar rapi
  const watermarkText = "ID: " + currentSeedName;
  hdCtx.font = "bold 26px -apple-system, BlinkMacSystemFont, sans-serif";
  hdCtx.textAlign = "right";
  hdCtx.textBaseline = "bottom";
  
  // Efek bayangan ringan agar terlihat jelas di berbagai warna background
  hdCtx.fillStyle = "rgba(0, 0, 0, 0.4)";
  hdCtx.fillText(watermarkText, 1024 - 18, 1024 - 18);
  hdCtx.fillStyle = "rgba(255, 255, 255, 0.95)";
  hdCtx.fillText(watermarkText, 1024 - 20, 1024 - 20);

  return hdCanvas.toDataURL("image/jpeg", 0.95);
}

function downloadImage() {
  const name = currentSeedName || 'Avatar_Studio';
  const link = document.createElement("a");
  link.download = `${name}_HD.jpg`; 
  link.href = getHDCanvasData();
  link.click();
}

function updateBatchCount(change) {
  const input = document.getElementById("batchCount");
  let currentValue = parseInt(input.value) || 5;
  const min = parseInt(input.min) || 2;
  const max = parseInt(input.max) || 10;
  let newValue = currentValue + change;
  if(newValue >= min && newValue <= max) input.value = newValue;
}

function prepareBatch() {
  const batchCount = parseInt(document.getElementById("batchCount").value) || 5;
  const grid = document.getElementById("previewGrid");
  grid.innerHTML = "";
  batchImagesData = [];

  for (let i = 0; i < batchCount; i++) {
    const randomName = generateRandomName();
    applySeed(randomName); // generate dan render avatar ke canvas, juga merubah currentSeedName
    
    const dataURL = getHDCanvasData();
    const base64Data = dataURL.split(',')[1];
    
    batchImagesData.push({ name: randomName, data: base64Data });
    
    const img = document.createElement("img");
    img.src = dataURL;
    grid.appendChild(img);
  }
  
  const modal = document.getElementById("previewModal");
  modal.classList.add("active");
}

function closePreview() {
  const modal = document.getElementById("previewModal");
  modal.classList.remove("active");
  generateRandom();
}

async function downloadBatchZip() {
  if (typeof JSZip === 'undefined') {
    alert("Error: Library JSZip gagal dimuat. Harap periksa koneksi internet Anda.");
    return;
  }
  const btn = document.getElementById("btnDownloadZip");
  btn.textContent = "Memproses...";
  const zip = new JSZip();
  const folder = zip.folder("Avatars");

  for (const item of batchImagesData) {
    folder.file(`${item.name}_HD.jpg`, item.data, {base64: true});
  }

  zip.generateAsync({ type: "blob" }).then(function(content) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(content);
    
    const randomId = Math.random().toString(36).substring(2, 10);
    link.download = `_avatars_${randomId}.zip`;
    link.click();
    
    btn.textContent = "Mulai Download ZIP";
    closePreview();
  }).catch(function(err) {
    btn.textContent = "Mulai Download ZIP";
    console.error(err);
    alert("Gagal memproses file batch.");
  });
}

window.onload = async () => {
  await loadAssets(); 
  generateRandom();
};
</script>

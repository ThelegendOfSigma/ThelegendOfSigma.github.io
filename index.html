<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pabrik Muka Kartun</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #38BDF8;
    --card-bg: #FFFFFF;
    --border-color: #000000;
    --text-primary: #000000;
    --text-secondary: #444444;
    --accent: #FFDE59;
    --accent-hover: #FADA5E;
    --btn-primary: #FF5757;
    --danger: #FF3131;
    --border-thick: 4px solid var(--border-color);
    --shadow-chunky: 6px 6px 0px var(--border-color);
  }
  * { 
    box-sizing: border-box; 
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif; 
    margin: 0; 
    padding: 0; 
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none; 
  }
  input[type="text"], input[type="number"] {
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
  }
  body {
    background-color: var(--bg-main);
    background-image: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    display: block;
    min-height: 100vh;
    color: var(--text-primary);
  }
  .app-container {
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 24px;
  }
  .floating-lang-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #FFF;
    color: var(--border-color);
    border: 3px solid var(--border-color);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 4px 4px 0px var(--border-color);
    z-index: 999;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .floating-lang-btn:hover {
    transform: scale(1.1);
    background: var(--accent);
  }
  .floating-lang-btn:active {
    transform: scale(0.95) translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--border-color);
  }
  .loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 222, 89, 0.95);
    z-index: 1000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .loading-overlay.hidden { opacity: 0; visibility: hidden; }
  .loading-spinner {
    animation: bounce 0.5s alternate infinite cubic-bezier(.5,0.05,1,.5);
    margin-bottom: 20px;
    color: var(--border-color);
  }
  @keyframes bounce { 
    from { transform: translateY(0); }
    to { transform: translateY(-30px) scale(1.1); }
  }
  .loading-text {
    font-size: 20px; font-weight: 700; color: var(--border-color);
    margin-bottom: 16px; letter-spacing: 1px;
    text-transform: uppercase;
  }
  .loading-bar-bg {
    width: 250px; height: 16px; 
    background: #FFF;
    border: var(--border-thick);
    border-radius: 20px;
    box-shadow: 4px 4px 0px var(--border-color);
    overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%; width: 0%; background: var(--btn-primary);
    transition: width 0.2s ease-out;
  }
  .app-header {
    margin: 16px 16px 8px;
    padding: 16px;
    text-align: center;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 1px;
    border: var(--border-thick);
    border-radius: 20px;
    background: var(--accent);
    color: var(--border-color);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: var(--shadow-chunky);
    transform: rotate(-1deg);
  }
  .content-card {
    background: var(--card-bg);
    border: var(--border-thick);
    border-radius: 20px;
    box-shadow: 8px 8px 0px var(--border-color);
    margin: 8px 16px;
    overflow: hidden;
  }
  .canvas-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 10px, #f1f5f9 10px, #f1f5f9 20px);
  }
  .canvas-wrapper {
    width: 180px;
    height: 180px;
    background: #FFF;
    border-radius: 20px;
    border: var(--border-thick);
    box-shadow: var(--shadow-chunky);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    overflow: hidden;
    position: relative;
    transform: rotate(2deg);
    transition: transform 0.3s ease;
  }
  .canvas-wrapper:hover { transform: rotate(-2deg) scale(1.05); }
  canvas {
    width: 100%; height: auto;
    display: block; image-rendering: pixelated; pointer-events: none;
  }
  .username-display {
    font-size: 22px; font-weight: 700; color: var(--border-color);
    margin-bottom: 4px; text-decoration: underline; text-decoration-thickness: 3px;
    text-decoration-color: var(--btn-primary);
  }
  .status-badge {
    font-size: 14px; color: var(--border-color); font-weight: 600;
    background: var(--accent); padding: 4px 12px; border-radius: 20px;
    border: 2px solid var(--border-color); display: flex; align-items: center; gap: 4px;
  }
  .controls-section { padding: 24px; display: flex; flex-direction: column; gap: 20px; background: #FFF; }
  .input-group { display: flex; flex-direction: column; gap: 8px; }
  .input-label { font-size: 15px; font-weight: 700; color: var(--border-color); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .input-field {
    width: 100%; padding: 14px 16px; background: #FFF;
    border: var(--border-thick); border-radius: 12px; font-size: 16px;
    font-weight: 600; color: var(--text-primary); outline: none;
    box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1); transition: all 0.2s ease;
  }
  .input-field:focus { background: #FFFBEB; box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1), 0 0 0 4px var(--accent); }
  .action-row { display: flex; gap: 16px; }
  .btn {
    flex: 1; padding: 14px; background: #FFF; color: var(--border-color);
    border: var(--border-thick); border-radius: 12px; font-size: 16px;
    font-weight: 700; cursor: pointer; text-align: center;
    box-shadow: var(--shadow-chunky); transition: all 0.1s ease;
    text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 8px 8px 0px var(--border-color); }
  .btn:active:not(:disabled) { transform: translateY(6px) translateX(6px); box-shadow: 0px 0px 0px var(--border-color); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: 2px 2px 0px var(--border-color); transform: translateY(4px) translateX(4px); }
  .btn-premium { background: var(--btn-primary); color: #FFF; }
  .btn-premium:hover:not(:disabled) { background: #FF4040; }
  .lang-btn { background: #38BDF8; margin-bottom: 8px; justify-content: flex-start; padding-left: 20px;}
  .lang-btn:hover:not(:disabled) { background: #0ea5e9; }
  .batch-box {
    background: #E0F2FE; border: var(--border-thick); border-radius: 16px;
    padding: 16px; box-shadow: var(--shadow-chunky);
  }
  .stepper { display: flex; align-items: center; height: 48px; margin-bottom: 16px; background: #FFF; border-radius: 12px; border: var(--border-thick); overflow: hidden; }
  .stepper button { width: 48px; height: 100%; background: var(--accent); border: none; color: var(--border-color); font-size: 24px; font-weight: 900; cursor: pointer; transition: background 0.2s; }
  .stepper button:hover { background: #FCD34D; }
  .stepper button:active { background: #FBBF24; }
  .stepper button:first-child { border-right: var(--border-thick); }
  .stepper button:last-child { border-left: var(--border-thick); }
  .stepper input { flex: 1; height: 100%; background: #FFF; border: none; text-align: center; font-size: 20px; font-weight: 700; color: var(--border-color); pointer-events: none; }
  
  #customModeUI { display: none; flex-direction: column; }
  .c-gender-wrap { display: inline-flex; background: #fff; border: 2px solid #000; border-radius: 12px; overflow: hidden; box-shadow: 2px 2px 0 #000;}
  .c-gender-btn { padding: 10px 20px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
  .c-gender-btn.active { background: var(--accent); color: #000; }
  .c-gender-btn:not(.active) { background: #fff; color: #555; }
  .c-gender-btn:not(:first-child) { border-left: 2px solid #000; }
  
  .c-mid-section { display: flex; align-items: center; justify-content: center; padding: 16px 20px; }
  
  .c-bottom-scroll {
    max-height: 260px;
    overflow-y: auto;
    padding: 16px;
    background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 10px, #f1f5f9 10px, #f1f5f9 20px);
    border-top: var(--border-thick);
    border-bottom: var(--border-thick);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .c-bottom-scroll::-webkit-scrollbar { width: 10px; }
  .c-bottom-scroll::-webkit-scrollbar-track { background: #fff; border-left: 2px solid #000; }
  .c-bottom-scroll::-webkit-scrollbar-thumb { background: var(--accent); border: 2px solid #000; border-radius: 6px; }

  .c-box { background: #fff; border: 2px solid #000; border-radius: 16px; padding: 12px; box-shadow: 4px 4px 0 #000; display: flex; flex-wrap: wrap; gap: 10px; }
  .c-box-title { width: 100%; font-size: 13px; font-weight: 800; text-align: left; text-transform: uppercase; margin-bottom: 4px; color: var(--text-secondary); border-bottom: 2px dashed #000; padding-bottom: 6px; }
  
  .c-step { flex: 1 1 45%; min-width: 120px; display: flex; align-items: center; justify-content: space-between; background: #fff; border: 2px solid #000; border-radius: 8px; overflow: hidden; height: 34px; }
  .c-step button { width: 28px; height: 100%; border: none; background: var(--accent); font-weight: 900; cursor: pointer; color: #000; font-size: 14px; display:flex; justify-content:center; align-items:center; }
  .c-step button:first-child { border-right: 2px solid #000; }
  .c-step button:last-child { border-left: 2px solid #000; }
  .c-step button:active { background: #fBBF24; }
  .c-step span { font-size: 11px; font-weight: 700; text-transform: uppercase; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }

  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
  .modal-overlay.active { display: flex; opacity: 1; }
  .modal-content { background: var(--card-bg); width: 100%; max-width: 460px; border: var(--border-thick); border-radius: 24px; box-shadow: 12px 12px 0px var(--border-color); display: flex; flex-direction: column; overflow: hidden; transform: scale(0.8) rotate(-2deg); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .modal-overlay.active .modal-content { transform: scale(1) rotate(0deg); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: var(--border-thick); background: var(--accent); font-weight: 700; font-size: 20px; text-transform: uppercase; }
  .modal-header span { display: flex; align-items: center; gap: 8px; }
  .btn-close { background: var(--danger); border: 3px solid var(--border-color); color: #FFF; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 2px 2px 0px var(--border-color); transition: all 0.1s; display: flex; justify-content: center; align-items: center; }
  .btn-close:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--border-color); }
  .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 16px; max-height: 50vh; overflow-y: auto; padding: 24px; background: #FFFBEB; }
  .preview-grid::-webkit-scrollbar { width: 12px; }
  .preview-grid::-webkit-scrollbar-track { background: #FFF; border-left: 2px solid #000; }
  .preview-grid::-webkit-scrollbar-thumb { background: var(--accent); border: 2px solid #000; border-radius: 10px; }
  .preview-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--border-color); transition: transform 0.2s; }
  .preview-grid img:hover { transform: scale(1.1) rotate(5deg); }
  .modal-footer { padding: 20px; border-top: var(--border-thick); background: #FFF; }

  /* Style Tambahan Fitur Favorit & Meme Generator */
  .fav-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #FFF;
    border: 2px solid #000;
    border-radius: 12px;
    box-shadow: 3px 3px 0 #000;
  }
  .fav-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .fav-title {
    font-size: 14px;
    font-weight: 700;
  }
  .fav-actions {
    display: flex;
    gap: 6px;
  }
  .fav-actions button {
    padding: 6px 10px;
    font-size: 12px;
  }
  .meme-canvas-preview {
    width: 100%;
    max-width: 300px;
    border: 3px solid #000;
    border-radius: 12px;
    box-shadow: 4px 4px 0 #000;
    margin: 0 auto 16px;
    display: block;
  }
</style>
</head>
<body>
<button id="btnFloatingLang" onclick="openLangModal()" class="floating-lang-btn" title="Ganti Bahasa">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
</button>
<div id="langModal" class="modal-overlay">
  <div class="modal-content" style="max-width: 350px;">
    <div class="modal-header">
      <span style="margin: 0 auto;" id="langModalTitle">
        Pilih Bahasa / Language
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      </span>
    </div>
    <div style="padding: 24px; display: flex; flex-direction: column; gap: 8px; background: #FFFBEB;">
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('id')">Indonesia (Kocak)</button>
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('en')">English (Slang)</button>
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('ar')">العربية (Farafish)</button>
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('ja')">日本語 (Kansai)</button>
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('tl')">Tagalog (Lods)</button>
    </div>
  </div>
</div>
<div id="loadingOverlay" class="loading-overlay">
  <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="loading-spinner"><circle cx="12" cy="12" r="10"/><path d="M8 9h.01M16 9h.01M9 15c1.5 1.5 4.5 1.5 6 0"/></svg>
  <div class="loading-text" id="loadingText">Memuat... 0%</div>
  <div class="loading-bar-bg"><div class="loading-bar-fill" id="loadingBar"></div></div>
</div>

<div class="app-container">
  <div class="app-header" id="appTitle">Pabrik Muka Kartun</div>
  
  <div id="standardModeUI">
    <div class="content-card">
      <div class="canvas-section" id="standardCanvasContainer">
        <div class="canvas-wrapper" id="mainCanvasWrapper">
          <canvas id="canvas" width="256" height="256"></canvas>
        </div>
        <div class="username-display" id="displayUsername">@siapaCuy</div>
        <div class="status-badge" id="statusInfo">Lagi dandan...</div>
      </div>
    </div>
    <div class="content-card controls-section">
      <button class="btn" id="btnModeToggle" onclick="toggleMode()" style="background: var(--accent); margin-bottom: 8px;">
        Pindah ke Mode Kustom 🛠️
      </button>
      <div class="input-group" id="seedGroup">
        <label class="input-label" id="labelName">Ketik Nama</label>
        <input type="text" id="seedInput" class="input-field" placeholder="Ketik apa aja..." autocomplete="off">
      </div>
      <div class="action-row">
        <button class="btn" id="btnAcak" onclick="generateRandom()">Acak</button>
        <button class="btn btn-premium" id="btnComot" onclick="downloadImage()">Comot</button>
      </div>
      
      <!-- Action Row untuk Favorit di Standard Mode -->
      <div class="action-row" style="margin-top: -10px;">
        <button class="btn" onclick="saveToFavorites()" style="background: #FCD34D;">Simpan Favorit ⭐</button>
        <button class="btn" onclick="openFavoritesModal()" style="background: #A7F3D0;">Lihat Favorit 📂</button>
      </div>

      <div class="batch-box">
        <label class="input-label" id="labelBatch" style="display:block; margin-bottom: 12px;">Borongan (Maks 27)</label>
        <div class="stepper">
          <button type="button" onclick="updateBatchCount(-1)">-</button>
          <input type="number" id="batchCount" value="5" min="2" max="27" readonly>
          <button type="button" onclick="updateBatchCount(1)">+</button>
        </div>
        <button class="btn btn-premium" id="btnGenerateBatch" style="width: 100%; background: #22C55E;" onclick="prepareBatch()">Bikin Sekebon!</button>
      </div>
    </div>
  </div>

  <div id="customModeUI">
    <div class="content-card" style="display: flex; flex-direction: column; margin-bottom: 16px;">
      <div style="padding: 20px 20px 10px; text-align: center;">
        <div class="c-gender-wrap">
          <button id="btnCGenMale" class="c-gender-btn active" onclick="setCGender(false)">Cowok</button>
          <button id="btnCGenFemale" class="c-gender-btn" onclick="setCGender(true)">Cewek</button>
        </div>
      </div>
      
      <div class="c-mid-section">
        <div id="customCanvasSlot" style="flex: 0 0 180px; display: flex; justify-content: center; position: relative;">
        </div>
      </div>

      <div class="c-bottom-scroll">
        <div class="c-box">
          <div class="c-box-title" id="titleFace">Wajah</div>
          <div class="c-step"><button onclick="changeC('eye', -1)">&lt;</button><span id="c_eye">0</span><button onclick="changeC('eye', 1)">&gt;</button></div>
          <div class="c-step"><button onclick="changeC('mouth', -1)">&lt;</button><span id="c_mouth">0</span><button onclick="changeC('mouth', 1)">&gt;</button></div>
          <div class="c-step"><button onclick="changeC('skin', -1)">&lt;</button><span class="trans-color">Warna</span><button onclick="changeC('skin', 1)">&gt;</button></div>
        </div>

        <div class="c-box">
          <div class="c-box-title" id="titleBg">Background</div>
          <div class="c-step"><button onclick="changeC('bgColor', -1)">&lt;</button><span class="trans-color">Warna</span><button onclick="changeC('bgColor', 1)">&gt;</button></div>
          <div class="c-step"><button onclick="changeC('texPaper', -1)">&lt;</button><span class="trans-texture">Tekstur</span><button onclick="changeC('texPaper', 1)">&gt;</button></div>
        </div>
        
        <div class="c-box">
          <div class="c-box-title" id="titleBody">Tubuh</div>
          <div class="c-step"><button onclick="changeC('body', -1)">&lt;</button><span id="c_body">0</span><button onclick="changeC('body', 1)">&gt;</button></div>
          <div class="c-step"><button onclick="changeC('bodyColor', -1)">&lt;</button><span class="trans-color">Warna</span><button onclick="changeC('bodyColor', 1)">&gt;</button></div>
          <div class="c-step"><button onclick="changeC('texFabric', -1)">&lt;</button><span class="trans-texture">Tekstur</span><button onclick="changeC('texFabric', 1)">&gt;</button></div>
        </div>
        
        <div class="c-box">
          <div class="c-box-title" id="titleHair">Rambut</div>
          <div class="c-step"><button onclick="changeC('hairF', -1)">&lt;</button><span id="c_hairF">0</span><button onclick="changeC('hairF', 1)">&gt;</button></div>
          <div class="c-step" id="c_hairB_row" style="display: none;"><button onclick="changeC('hairB', -1)">&lt;</button><span id="c_hairB">0</span><button onclick="changeC('hairB', 1)">&gt;</button></div>
          <div class="c-step"><button onclick="changeC('hairColor', -1)">&lt;</button><span class="trans-color">Warna</span><button onclick="changeC('hairColor', 1)">&gt;</button></div>
          <div class="c-step"><button onclick="changeC('texHair', -1)">&lt;</button><span class="trans-texture">Tekstur</span><button onclick="changeC('texHair', 1)">&gt;</button></div>
        </div>
      </div>
      
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fff;">
        <div style="display: flex; gap: 12px;">
          <button class="btn" onclick="saveToFavorites()" style="background: #FCD34D;">Fav ⭐</button>
          <button class="btn" onclick="openFavoritesModal()" style="background: #A7F3D0;">Buka Fav 📂</button>
          <button class="btn" style="background: #C084FC; color: #FFF;" onclick="openMemeModal()">Jadikan Meme 🤡</button>
        </div>
        <div style="display: flex; gap: 12px;">
          <button class="btn" id="btnToggleRandom" style="flex: 1; background: var(--accent);" onclick="toggleMode()">Kembali Acak 🎲</button>
          <button class="btn btn-premium" id="btnComotCustom" style="flex: 1;" onclick="downloadImage()">Comot Karakter 📸</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Pratinjau Borongan -->
<div class="modal-overlay" id="previewModal">
  <div class="modal-content">
    <div class="modal-header">

const loadImg = (url) => new Promise((resolve) => { 
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => { 
    const canvasFallback = document.createElement("canvas"); 
    canvasFallback.width = 256; canvasFallback.height = 256; 
    resolve(canvasFallback); 
  };
  img.src = url; 
});

async function loadAssets() {
  const loadingOverlay = document.getElementById("loadingOverlay");
  const loadingBar = document.getElementById("loadingBar");
  const loadingText = document.getElementById("loadingText");
  
  const allUrls = [];
  for (let i = 1; i <= TOTAL_TEXTURES; i++) allUrls.push(`img_${String(i).padStart(2, '0')}.png`);
  for (const category in assetList) allUrls.push(...assetList[category]);
  
  const totalAssets = allUrls.length;
  let loaded = 0;
  
  const updateProgress = () => {
    loaded++;
    const percent = Math.floor((loaded / totalAssets) * 100);
    loadingBar.style.width = percent + "%"; 
    loadingText.textContent = `${t('loadingPrefix')} ${percent}%`;
  };

  const loadWithProgress = (url) => loadImg(url).then(img => { updateProgress(); return img; });
  
  const texturePromises = [];
  for (let i = 1; i <= TOTAL_TEXTURES; i++) {
    texturePromises.push(loadWithProgress(`img_${String(i).padStart(2, '0')}.png`));
  }
  
  const partPromises = {};
  for (const category in assetList) {
    partPromises[category] = Promise.all(assetList[category].map(loadWithProgress));
  }
  
  const resolvedTextures = await Promise.all(texturePromises);
  loadedTextures = resolvedTextures.map(img => ctx.createPattern(img, "repeat"));
  
  for (const category in assetList) {
    loadedParts[category] = await partPromises[category];
  }
  
  setTimeout(() => { loadingOverlay.classList.add("hidden"); }, 500);
  isAppReady = true; statusInfo.innerHTML = t('loadingReady');
}

function invertHexColor(hex) {
  hex = hex.replace('#', '');
  let r = (255 - parseInt(hex.substring(0, 2), 16)).toString(16).padStart(2, '0');
  let g = (255 - parseInt(hex.substring(2, 4), 16)).toString(16).padStart(2, '0');
  let b = (255 - parseInt(hex.substring(4, 6), 16)).toString(16).padStart(2, '0');
  return '#' + r + g + b;
}

class PRNG {
  constructor(seedStr) { this.seed = this.hashString(seedStr); }
  hashString(str) { let h = 2166136261; for(let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24); } return h >>> 0; }
  next() { this.seed = (this.seed * 1664525 + 1013904223) >>> 0; return this.seed / 4294967296; }
}

// Generator ID Kustom berdasarkan Konfigurasi
function generateConfigHash() {
  const c = currentConfig;
  const str = `${c.isFemale?1:0}-${c.skin}-${c.bgColor}-${c.bodyColor}-${c.hairColor}-${c.body}-${c.eye}-${c.mouth}-${c.hairB}-${c.hairF}-${c.texFabric}-${c.texHair}-${c.texPaper}`;
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
  }
  const positiveHash = Math.abs(hash).toString(16).toUpperCase();
  return "CUS-" + positiveHash.padStart(6, '0');
}

function changeC(type, dir) {
  let max = 0;
  switch(type) {
    case 'mouth': max = Math.max(0, loadedParts.mouth.length - 1); break;
    case 'eye': max = Math.max(0, (currentConfig.isFemale ? loadedParts.eyes_female.length : loadedParts.eyes_male.length) - 1); break;
    case 'body': max = Math.max(0, loadedParts.body.length - 1); break;
    case 'skin': max = palettes.skin.length - 1; break;
    case 'bgColor': case 'bodyColor': case 'hairColor': max = palettes.themes.length - 1; break;
    case 'texPaper': case 'texFabric': case 'texHair': max = Math.max(0, loadedTextures.length - 1); break;
    case 'hairF': max = Math.max(0, (currentConfig.isFemale ? loadedParts.hair_f_female.length : loadedParts.hair_f_male.length) - 1); break;
    case 'hairB': max = Math.max(0, loadedParts.hair_b.length - 1); break;
  }
  
  let val = currentConfig[type];
  if(val === undefined || val === -1) val = 0;
  if(max < 0) max = 0;
  
  val += dir;
  if(val < 0) val = max;
  if(val > max) val = 0;
  
  currentConfig[type] = val;
  updateCustomUI();
  drawAvatar();
}

  const mapSpans = ['mouth', 'eye', 'body', 'hairF', 'hairB'];
  mapSpans.forEach(key => {
    const el = document.getElementById('c_' + key);
    if(el && currentConfig[key] !== undefined) el.innerText = currentConfig[key] + 1;
  });
  
  document.getElementById("btnCGenMale").classList.toggle("active", !currentConfig.isFemale);
  document.getElementById("btnCGenFemale").classList.toggle("active", currentConfig.isFemale);
  document.getElementById("c_hairB_row").style.display = currentConfig.isFemale ? "flex" : "none";
}

function drawPart(imgElement, color, texture = null) {
  if (!imgElement) return;
  
  if ((!color || color === "#ffffff") && !texture) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
    return;
  }
  
  offCtx.clearRect(0, 0, 256, 256);
  
  offCtx.globalCompositeOperation = 'source-over';
  offCtx.drawImage(imgElement, 0, 0, 256, 256);
  
  if (color && color !== "#ffffff") {
    offCtx.globalCompositeOperation = 'multiply';
    offCtx.fillStyle = color;
    offCtx.fillRect(0, 0, 256, 256);
  }
  
  if (texture) {
    offCtx.globalCompositeOperation = 'multiply';
    offCtx.globalAlpha = 0.55;
    offCtx.fillStyle = texture;
    offCtx.fillRect(0, 0, 256, 256);
    offCtx.globalAlpha = 1.0;
  }
  
  offCtx.globalCompositeOperation = 'destination-in';
  offCtx.drawImage(imgElement, 0, 0, 256, 256);
  
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(offCanvas, 0, 0, canvas.width, canvas.height);
}

function drawAvatar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const skin = palettes.skin[currentConfig.skin];
  const bgTheme = palettes.themes[currentConfig.bgColor];
  const bodyTheme = palettes.themes[currentConfig.bodyColor];
  const hairTheme = palettes.themes[currentConfig.hairColor];
  
  const fabricTex = loadedTextures.length ? loadedTextures[currentConfig.texFabric] : null;
  const hairTex = loadedTextures.length ? loadedTextures[currentConfig.texHair] : null;
  const paperTex = loadedTextures.length ? loadedTextures[currentConfig.texPaper] : null;
  
  const bgInvMain = invertHexColor(bgTheme.main);
  const bgInvSec = invertHexColor(bgTheme.sec);
  const bgGrd = ctx.createRadialGradient(128, 128, 0, 128, 128, 200);
  bgGrd.addColorStop(0, bgInvMain); bgGrd.addColorStop(1, bgInvSec);
  ctx.fillStyle = bgGrd; 
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (paperTex) { ctx.globalAlpha = 0.35; ctx.fillStyle = paperTex; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = 1.0; }
  
  if(currentConfig.hairB !== -1 && loadedParts.hair_b[currentConfig.hairB]) drawPart(loadedParts.hair_b[currentConfig.hairB], hairTheme.hDark, hairTex);
  if(loadedParts.head[0]) drawPart(loadedParts.head[0], skin.base);
  if(loadedParts.body[currentConfig.body]) drawPart(loadedParts.body[currentConfig.body], bodyTheme.main, fabricTex);
  
  if (currentConfig.isFemale) { if(loadedParts.eyes_female[currentConfig.eye]) drawPart(loadedParts.eyes_female[currentConfig.eye], "#ffffff"); } 
  else { if(loadedParts.eyes_male[currentConfig.eye]) drawPart(loadedParts.eyes_male[currentConfig.eye], "#ffffff"); }
  
  if(loadedParts.mouth[currentConfig.mouth]) drawPart(loadedParts.mouth[currentConfig.mouth], "#ffffff");
  
  if (currentConfig.isFemale) { if(loadedParts.hair_f_female[currentConfig.hairF]) drawPart(loadedParts.hair_f_female[currentConfig.hairF], hairTheme.hair, hairTex); } 
  else { if(loadedParts.hair_f_male[currentConfig.hairF]) drawPart(loadedParts.hair_f_male[currentConfig.hairF], hairTheme.hair, hairTex); }
  
  // Set ID unik ketika mode kustom aktif
  if (isCustomMode) {
      currentSeedName = generateConfigHash();
  }
  
  displayUsername.textContent = `@${currentSeedName.toLowerCase()}`;
}

function applySeed(seedStr) {
  if (!seedStr) seedStr = "OrangAsing"; 
  currentSeedName = seedStr;
  if (document.activeElement !== seedInput) seedInput.value = seedStr; 
  const rng = new PRNG(seedStr);
  const isFemale = rng.next() > 0.5;
  
  currentConfig = {
    isFemale: isFemale, 
    skin: Math.floor(rng.next() * palettes.skin.length),
    bgColor: Math.floor(rng.next() * palettes.themes.length),
    bodyColor: Math.floor(rng.next() * palettes.themes.length),
    hairColor: Math.floor(rng.next() * palettes.themes.length),
    body: Math.floor(rng.next() * Math.max(1, loadedParts.body.length)),
    eye: isFemale ? Math.floor(rng.next() * Math.max(1, loadedParts.eyes_female.length)) : Math.floor(rng.next() * Math.max(1, loadedParts.eyes_male.length)),
    mouth: Math.floor(rng.next() * Math.max(1, loadedParts.mouth.length)),
    hairB: isFemale ? Math.floor(rng.next() * Math.max(1, loadedParts.hair_b.length)) : -1, 
    hairF: isFemale ? Math.floor(rng.next() * Math.max(1, loadedParts.hair_f_female.length)) : Math.floor(rng.next() * Math.max(1, loadedParts.hair_f_male.length)),
    texFabric: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES)),
    texHair: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES)),
    texPaper: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES))
  };
  drawAvatar();
}

seedInput.addEventListener("input", (e) => applySeed(e.target.value));

function generateRandomName() {
  const kons = "bcdfghjklmnprstvwxyz", voks = "aeiou";
  let name = "";
  for(let i=0; i<6; i++) name += i%2===0 ? kons[Math.floor(Math.random()*kons.length)] : voks[Math.floor(Math.random()*voks.length)];
  return name.charAt(0).toUpperCase() + name.slice(1) + Math.floor(10+Math.random()*89);
}

function generateRandom() { applySeed(generateRandomName()); }

function getHDCanvasData() {
  const hdCanvas = document.createElement("canvas");
  hdCanvas.width = 1024; hdCanvas.height = 1024;
  const hdCtx = hdCanvas.getContext("2d");
  hdCtx.fillStyle = "#FFFFFF"; hdCtx.fillRect(0, 0, 1024, 1024);
  hdCtx.imageSmoothingEnabled = false; hdCtx.drawImage(canvas, 0, 0, 1024, 1024); hdCtx.imageSmoothingEnabled = true;
  const watermarkText = "ID: " + currentSeedName;
  hdCtx.font = "bold 28px 'Fredoka', sans-serif"; hdCtx.textAlign = "right"; hdCtx.textBaseline = "bottom";
  hdCtx.fillStyle = "#000000"; hdCtx.fillText(watermarkText, 1024 - 17, 1024 - 17);
  hdCtx.fillStyle = "#FFDE59"; hdCtx.fillText(watermarkText, 1024 - 20, 1024 - 20);
  return hdCanvas.toDataURL("image/jpeg", 0.95);
}

function downloadImage() {
  const name = currentSeedName || 'Muka_Kartun';
  const link = document.createElement("a"); link.download = `${name}_SuperHD.jpg`; link.href = getHDCanvasData(); link.click();
}

function updateBatchCount(change) {
  const input = document.getElementById("batchCount");
  let currentValue = parseInt(input.value) || 5;
  let newValue = currentValue + change;
  if(newValue >= (parseInt(input.min) || 2) && newValue <= (parseInt(input.max) || 27)) input.value = newValue;
}

function prepareBatch() {
  const btn = document.getElementById("btnGenerateBatch");
  const originalText = btn.innerHTML; btn.innerHTML = t('batchThinking'); btn.disabled = true;
  setTimeout(() => {
    const batchCount = parseInt(document.getElementById("batchCount").value) || 5;
    const grid = document.getElementById("previewGrid"); grid.innerHTML = ""; batchImagesData = [];
    for (let i = 0; i < batchCount; i++) {
      const randomName = generateRandomName(); applySeed(randomName); 
      const dataURL = getHDCanvasData(); batchImagesData.push({ name: randomName, data: dataURL.split(',')[1] });
      const img = document.createElement("img"); img.src = dataURL; grid.appendChild(img);
    }
    document.getElementById("previewModal").classList.add("active");
    btn.innerHTML = originalText; btn.disabled = false;
  }, 2000); 
}

function closePreview() { document.getElementById("previewModal").classList.remove("active"); generateRandom(); }

async function downloadBatchImages() {
  const btn = document.getElementById("btnDownloadBatch"); btn.innerHTML = t('batchDownloading'); btn.disabled = true;
  for (let i = 0; i < batchImagesData.length; i++) {
    const item = batchImagesData[i];
    const link = document.createElement("a"); link.href = "data:image/jpeg;base64," + item.data; link.download = `${item.name}_SuperHD.jpg`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    await new Promise(resolve => setTimeout(resolve, 300));
  }
  btn.innerHTML = t('batchDone');
  setTimeout(() => { btn.innerHTML = t('btnDownloadAll'); btn.disabled = false; closePreview(); }, 1500);
}

/* --- FITUR FAVORIT (LOCALSTORAGE) --- */
function getFavorites() {
  return JSON.parse(localStorage.getItem('pabrikKartunFavorites') || '[]');
}

function saveToFavorites() {
  const favorites = getFavorites();
  const exists = favorites.some(fav => fav.id === currentSeedName);
  if (exists) {
    alert('Kombinasi ini sudah ada di favorit!');
    return;
  }
  favorites.push({
    id: currentSeedName,
    isCustom: isCustomMode,
    config: { ...currentConfig }
  });
  localStorage.setItem('pabrikKartunFavorites', JSON.stringify(favorites));
  alert('Berhasil disimpan ke Favorit! ⭐');
}

function deleteFavorite(id) {
  let favorites = getFavorites();
  favorites = favorites.filter(fav => fav.id !== id);
  localStorage.setItem('pabrikKartunFavorites', JSON.stringify(favorites));
  renderFavoritesList();
}

function loadFavorite(id) {
  const favorites = getFavorites();
  const target = favorites.find(fav => fav.id === id);
  if (!target) return;

  if (target.isCustom) {
    if (!isCustomMode) toggleMode();
    currentConfig = { ...target.config };
    updateCustomUI();
    drawAvatar();
  } else {
    if (isCustomMode) toggleMode();
    applySeed(target.id);
  }
  closeFavoritesModal();
}

function renderFavoritesList() {
  const listEl = document.getElementById('favoritesList');
  const favorites = getFavorites();
  if (favorites.length === 0) {
    listEl.innerHTML = '<div style="text-align:center; padding: 20px; font-weight: bold;">Belum ada favorit tersimpan 😿</div>';
    return;
  }
  listEl.innerHTML = favorites.map(fav => `
    <div class="fav-card">
      <div class="fav-info">
        <span class="fav-title">@${fav.id.toLowerCase()}</span>
      </div>
      <div class="fav-actions">
        <button class="btn" style="background: var(--accent);" onclick="loadFavorite('${fav.id}')">Pakai 🎨</button>
        <button class="btn btn-premium" onclick="deleteFavorite('${fav.id}')">Hapus 🗑️</button>
      </div>
    </div>
  `).join('');
}

function openFavoritesModal() {
  renderFavoritesList();
  document.getElementById('favoritesModal').classList.add('active');
}

function closeFavoritesModal() {
  document.getElementById('favoritesModal').classList.remove('active');
}

/* --- FITUR MEME GENERATOR (3:4 Ratio, Top 1:4 Text, Bottom 1:1 Image) --- */
const memeCanvas = document.getElementById("memeCanvas");
const memeCtx = memeCanvas.getContext("2d");
const memeTextInput = document.getElementById("memeTextInput");

function updateMemeCanvas() {
  const w = 600;
  const h = 800; // Rasio 3:4 (600x800)
  
  const textRegionHeight = 200; // Komposisi 1:4 Atas
  const imageRegionHeight = 600; // Komposisi 1:1 Bawah (600x600)
  
  // Background Putih Teks Atas
  memeCtx.fillStyle = "#FFFFFF";
  memeCtx.fillRect(0, 0, w, textRegionHeight);
  
  // Draw Avatar ke Area Gambar (1:1 Bawah)
  memeCtx.drawImage(canvas, 0, textRegionHeight, w, imageRegionHeight);
  
  // Border Pembatas & Frame
  memeCtx.lineWidth = 8;
  memeCtx.strokeStyle = "#000000";
  memeCtx.strokeRect(0, 0, w, h);
  memeCtx.beginPath();
  memeCtx.moveTo(0, textRegionHeight);
  memeCtx.lineTo(w, textRegionHeight);
  memeCtx.stroke();

  // Render Teks Meme
  const text = memeTextInput.value.trim().toUpperCase() || "TEKS MEME";
  memeCtx.fillStyle = "#000000";
  memeCtx.font = "bold 36px 'Fredoka', sans-serif";
  memeCtx.textAlign = "center";
  memeCtx.textBaseline = "middle";

  // Fit Teks Multiline / Wrap
  const words = text.split(" ");
  let lines = [];
  let currentLine = words[0] || "";

  for (let i = 1; i < words.length; i++) {
    let testLine = currentLine + " " + words[i];
    let metrics = memeCtx.measureText(testLine);
    if (metrics.width > w - 40) {
      lines.push(currentLine);
      currentLine = words[i];
    } else {
      currentLine = testLine;
    }
  }
  lines.push(currentLine);

  const lineHeight = 42;
  const startY = (textRegionHeight / 2) - ((lines.length - 1) * lineHeight / 2);

  lines.forEach((line, index) => {
    memeCtx.fillText(line, w / 2, startY + (index * lineHeight));
  });
}

memeTextInput.addEventListener("input", updateMemeCanvas);

function openMemeModal() {
  document.getElementById("memeModal").classList.add("active");
  updateMemeCanvas();
}

function closeMemeModal() {
  document.getElementById("memeModal").classList.remove("active");
}

function downloadMemeImage() {
  const link = document.createElement("a");
  link.download = `Meme_${currentSeedName}.jpg`;
  link.href = memeCanvas.toDataURL("image/jpeg", 0.95);
  link.click();
}

window.onload = async () => {
  const savedLang = localStorage.getItem('pabrikKartunLang');
  if (!savedLang) document.getElementById('langModal').classList.add('active'); else applyTranslations(savedLang);
  applyTranslations(savedLang || 'id'); await loadAssets(); generateRandom();
};

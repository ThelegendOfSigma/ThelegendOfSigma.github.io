<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pabrik Muka Kartun</title>
<!-- Menggunakan font Fredoka yang bulat dan kartunis -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #38BDF8; /* Biru langit cerah */
    --card-bg: #FFFFFF;
    --border-color: #000000;
    --text-primary: #000000;
    --text-secondary: #444444;
    --accent: #FFDE59; /* Kuning pisang */
    --accent-hover: #FADA5E;
    --btn-primary: #FF5757; /* Merah komik */
    --danger: #FF3131;
    --border-thick: 4px solid var(--border-color);
    --shadow-chunky: 6px 6px 0px var(--border-color);
  }

  * { 
    box-sizing: border-box; 
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif; 
    margin: 0; 
    padding: 0; 
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none; 
  }

  input[type="text"], input[type="number"] {
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
  }

  body {
    background-color: var(--bg-main);
    /* Pola polkadot ala komik retro */
    background-image: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    color: var(--text-primary);
  }

  /* --- Tombol Floating Bahasa --- */
  .floating-lang-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #FFF;
    color: var(--border-color);
    border: 3px solid var(--border-color);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 4px 4px 0px var(--border-color);
    z-index: 999;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .floating-lang-btn:hover {
    transform: scale(1.1);
    background: var(--accent);
  }
  .floating-lang-btn:active {
    transform: scale(0.95) translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--border-color);
  }

  /* --- Loading Overlay Styles --- */
  .loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 222, 89, 0.95);
    z-index: 1000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .loading-overlay.hidden { opacity: 0; visibility: hidden; }
  
  .loading-spinner {
    animation: bounce 0.5s alternate infinite cubic-bezier(.5,0.05,1,.5);
    margin-bottom: 20px;
    color: var(--border-color);
  }

  @keyframes bounce { 
    from { transform: translateY(0); }
    to { transform: translateY(-30px) scale(1.1); }
  }

  .loading-text {
    font-size: 20px; font-weight: 700; color: var(--border-color);
    margin-bottom: 16px; letter-spacing: 1px;
    text-transform: uppercase;
  }
  .loading-bar-bg {
    width: 250px; height: 16px; 
    background: #FFF;
    border: var(--border-thick);
    border-radius: 20px;
    box-shadow: 4px 4px 0px var(--border-color);
    overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%; width: 0%; background: var(--btn-primary);
    transition: width 0.2s ease-out;
  }

  /* --- App Styles --- */
  .app-card {
    background: var(--card-bg);
    width: 100%;
    max-width: 400px;
    border: var(--border-thick);
    border-radius: 24px;
    box-shadow: 10px 10px 0px var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: rotate(-1deg);
  }

  .app-header {
    padding: 20px;
    text-align: center;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 1px;
    border-bottom: var(--border-thick);
    background: var(--accent);
    color: var(--border-color);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .canvas-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    background: repeating-linear-gradient(
      45deg,
      #f8fafc,
      #f8fafc 10px,
      #f1f5f9 10px,
      #f1f5f9 20px
    );
  }

  .canvas-wrapper {
    width: 180px;
    height: 180px;
    background: #FFF;
    border-radius: 20px;
    border: var(--border-thick);
    box-shadow: var(--shadow-chunky);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    overflow: hidden;
    position: relative;
    transform: rotate(2deg);
    transition: transform 0.3s ease;
  }

  .canvas-wrapper:hover {
    transform: rotate(-2deg) scale(1.05);
  }
  
  canvas {
    width: 100%; 
    height: auto;
    display: block;
    image-rendering: pixelated;
    pointer-events: none;
  }

  .username-display {
    font-size: 22px;
    font-weight: 700;
    color: var(--border-color);
    margin-bottom: 4px;
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-decoration-color: var(--btn-primary);
  }

  .status-badge {
    font-size: 14px;
    color: var(--border-color);
    font-weight: 600;
    background: var(--accent);
    padding: 4px 12px;
    border-radius: 20px;
    border: 2px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .controls-section {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: #FFF;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .input-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--border-color);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .input-field {
    width: 100%;
    padding: 14px 16px;
    background: #FFF;
    border: var(--border-thick);
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    outline: none;
    box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1);
    transition: all 0.2s ease;
  }

  .input-field:focus {
    background: #FFFBEB;
    box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1), 0 0 0 4px var(--accent);
  }

  .action-row {
    display: flex;
    gap: 16px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    background: #FFF;
    color: var(--border-color);
    border: var(--border-thick);
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    box-shadow: var(--shadow-chunky);
    transition: all 0.1s ease;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover:not(:disabled) { 
    transform: translateY(-2px);
    box-shadow: 8px 8px 0px var(--border-color);
  }
  
  .btn:active:not(:disabled) { 
    transform: translateY(6px) translateX(6px);
    box-shadow: 0px 0px 0px var(--border-color);
  }
  
  .btn:disabled {
    opacity: 0.6; cursor: not-allowed;
    box-shadow: 2px 2px 0px var(--border-color);
    transform: translateY(4px) translateX(4px);
  }

  .btn-premium { background: var(--btn-primary); color: #FFF; }
  .btn-premium:hover:not(:disabled) { background: #FF4040; }
  
  .lang-btn { background: #38BDF8; margin-bottom: 8px; justify-content: flex-start; padding-left: 20px;}
  .lang-btn:hover:not(:disabled) { background: #0ea5e9; }

  .batch-box {
    background: #E0F2FE;
    border: var(--border-thick);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow-chunky);
  }

  .stepper {
    display: flex;
    align-items: center;
    height: 48px;
    margin-bottom: 16px;
    background: #FFF;
    border-radius: 12px;
    border: var(--border-thick);
    overflow: hidden;
  }

  .stepper button {
    width: 48px;
    height: 100%;
    background: var(--accent);
    border: none;
    color: var(--border-color);
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
    transition: background 0.2s;
  }
  .stepper button:hover { background: #FCD34D; }
  .stepper button:active { background: #FBBF24; }
  .stepper button:first-child { border-right: var(--border-thick); }
  .stepper button:last-child { border-left: var(--border-thick); }

  .stepper input {
    flex: 1;
    height: 100%;
    background: #FFF;
    border: none;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--border-color);
    pointer-events: none;
  }

  /* Modal Preview */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  
  .modal-overlay.active {
    display: flex;
    opacity: 1;
  }

  .modal-content {
    background: var(--card-bg);
    width: 100%;
    max-width: 460px;
    border: var(--border-thick);
    border-radius: 24px;
    box-shadow: 12px 12px 0px var(--border-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: scale(0.8) rotate(-2deg);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .modal-overlay.active .modal-content {
    transform: scale(1) rotate(0deg);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: var(--border-thick);
    background: var(--accent);
    font-weight: 700;
    font-size: 20px;
    text-transform: uppercase;
  }
  
  .modal-header span {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-close {
    background: var(--danger);
    border: 3px solid var(--border-color);
    color: #FFF;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 2px 2px 0px var(--border-color);
    transition: all 0.1s;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .btn-close:active {
    transform: translate(2px, 2px);
    box-shadow: 0px 0px 0px var(--border-color);
  }

  .preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 16px;
    max-height: 50vh;
    overflow-y: auto;
    padding: 24px;
    background: #FFFBEB;
  }

  .preview-grid::-webkit-scrollbar { width: 12px; }
  .preview-grid::-webkit-scrollbar-track { background: #FFF; border-left: 2px solid #000; }
  .preview-grid::-webkit-scrollbar-thumb { background: var(--accent); border: 2px solid #000; border-radius: 10px; }

  .preview-grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 16px;
    border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    transition: transform 0.2s;
  }
  
  .preview-grid img:hover { transform: scale(1.1) rotate(5deg); }

  .modal-footer {
    padding: 20px;
    border-top: var(--border-thick);
    background: #FFF;
  }
</style>
</head>
<body>

<!-- Tombol Ganti Bahasa Mengambang -->
<button id="btnFloatingLang" onclick="openLangModal()" class="floating-lang-btn" title="Ganti Bahasa">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="2" y1="12" x2="22" y2="12"></line>
    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
  </svg>
</button>

<!-- Popup Pilihan Bahasa -->
<div id="langModal" class="modal-overlay">
  <div class="modal-content" style="max-width: 350px;">
    <div class="modal-header">
      <span style="margin: 0 auto;" id="langModalTitle">
        Pilih Bahasa / Language
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      </span>
    </div>
    <div style="padding: 24px; display: flex; flex-direction: column; gap: 8px; background: #FFFBEB;">
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('id')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Indonesia (Kocak)
      </button>
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('en')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        English (Slang)
      </button>
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('ar')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        العربية (Farafish)
      </button>
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('ja')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        日本語 (Kansai)
      </button>
      <button class="btn btn-premium lang-btn" onclick="selectLanguage('tl')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Tagalog (Lods)
      </button>
    </div>
  </div>
</div>

<!-- Layar Loading -->
<div id="loadingOverlay" class="loading-overlay">
  <!-- Spinner Face SVG -->
  <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="loading-spinner">
    <circle cx="12" cy="12" r="10"/><path d="M8 9h.01M16 9h.01M9 15c1.5 1.5 4.5 1.5 6 0"/>
  </svg>
  <div class="loading-text" id="loadingText">Memuat... 0%</div>
  <div class="loading-bar-bg">
    <div class="loading-bar-fill" id="loadingBar"></div>
  </div>
</div>

<div class="app-card">
  <div class="app-header" id="appTitle">Pabrik Muka Kartun</div>

  <div class="canvas-section">
    <div class="canvas-wrapper">
      <canvas id="canvas" width="256" height="256"></canvas>
    </div>
    <div class="username-display" id="displayUsername">@siapaCuy</div>
    <div class="status-badge" id="statusInfo">Lagi dandan...</div>
  </div>

  <div class="controls-section">
    <div class="input-group">
      <label class="input-label" id="labelName">Ketik Nama</label>
      <input type="text" id="seedInput" class="input-field" placeholder="Ketik apa aja..." autocomplete="off">
    </div>

    <div class="action-row">
      <button class="btn" id="btnAcak" onclick="generateRandom()">Acak</button>
      <button class="btn btn-premium" id="btnComot" onclick="downloadImage()">Comot</button>
    </div>

    <div class="batch-box">
      <label class="input-label" id="labelBatch" style="display:block; margin-bottom: 12px;">Borongan (Maks 27)</label>
      <div class="stepper">
        <button type="button" onclick="updateBatchCount(-1)">-</button>
        <input type="number" id="batchCount" value="5" min="2" max="27" readonly>
        <button type="button" onclick="updateBatchCount(1)">+</button>
      </div>
      <button class="btn btn-premium" id="btnGenerateBatch" style="width: 100%; background: #22C55E;" onclick="prepareBatch()">Bikin Sekebon!</button>
    </div>
  </div>
</div>

<!-- Modal Pratinjau Batch -->
<div class="modal-overlay" id="previewModal">
  <div class="modal-content">
    <div class="modal-header">
      <span id="modalBatchTitle">Hasil Borongan</span>
      <button class="btn-close" onclick="closePreview()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="preview-grid" id="previewGrid"></div>
    <div class="modal-footer">
      <button class="btn btn-premium" id="btnDownloadBatch" onclick="downloadBatchImages()" style="width: 100%;">
        Unduh Semua Hasil
      </button>
    </div>
  </div>
</div>

<script>
// --- Generator SVG Dinamis ---
const svgIcon = (path, size=20) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;

const icons = {
  palette: svgIcon('<path d="M12 22a10 10 0 1 1 0-20c2.5 0 4.5 2 4.5 4.5a4.5 4.5 0 0 1-4.5 4.5 3 3 0 0 0-3 3c0 1.5.5 2.5 1 3.5.5 1 1.5 2 1.5 3.5a1 1 0 0 1-1 1h-.5z"/><circle cx="7.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="10.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="14.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>', 22),
  wand: svgIcon('<path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8l1.4 1.4M17.8 6.2l1.4-1.4M12.2 6.2l-1.4-1.4M12.2 11.8l-1.4 1.4M3 21l9-9M12.2 6.2l-1.4 1.4"/>'),
  dice: svgIcon('<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/>'),
  camera: svgIcon('<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'),
  box: svgIcon('<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>'),
  tree: svgIcon('<path d="M12 22v-6M12 8V2M4 12l8-8 8 8M4 22l8-8 8 8"/>'),
  party: svgIcon('<path d="m5.8 11.3 2.9-2.9a2 2 0 0 1 2.8 0L17 14.1a2 2 0 0 1 0 2.8l-2.9 2.9a2 2 0 0 1-2.8 0L5.8 14.1a2 2 0 0 1 0-2.8z"/><path d="M4 20 7.3 16.7M15 5l-1.3 1.3M21 9l-1.3 1.3M8 3 9.3 4.3M3 8l1.3 1.3"/>'),
  rocket: svgIcon('<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5-4 5-4v5"/>'),
  sparkles: svgIcon('<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>', 16),
  brain: svgIcon('<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>'),
  drink: svgIcon('<path d="M7 11V3.2c0-.6.4-1 1-1h8c.6 0 1 .4 1 1V11M5 11h14M7 11l1.5 10c.1.6.6 1 1.2 1h4.6c.6 0 1.1-.4 1.2-1L17 11M10 2v5M14 2v5M12 16v-2"/>'),
  done: svgIcon('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>')
};

// --- Sistem Terjemahan ---
let isAppReady = false;

const translations = {

  document.getElementById('btnDownloadBatch').innerHTML = t('btnDownloadAll');
  document.getElementById('statusInfo').innerHTML = isAppReady ? t('loadingReady') : t('statusInit');
}

function openLangModal() {
  document.getElementById('langModal').classList.add('active');
}

  localStorage.setItem('pabrikKartunLang', lang);
  applyTranslations(lang);
  document.getElementById('langModal').classList.remove('active');

// --- Logika Canvas dan Aplikasi ---
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const seedInput = document.getElementById("seedInput");
const displayUsername = document.getElementById("displayUsername");
const statusInfo = document.getElementById("statusInfo");

const offCanvas = document.createElement("canvas");
offCanvas.width = 256;
offCanvas.height = 256;
const offCtx = offCanvas.getContext("2d");

const TOTAL_TEXTURES = 29;
let loadedTextures = [];
let loadedParts = { body: [], eyes_male: [], eyes_female: [], hair_b: [], hair_f_female: [], hair_f_male: [], head: [], mouth: [] };

const assetList = {
  body: Array.from({length: 12}, (_, i) => `body/body_${String(i+1).padStart(2, '0')}.png`),
  eyes_male: Array.from({length: 30}, (_, i) => `eyes_male/eyes_${String(i+1).padStart(2, '0')}.png`),
  eyes_female: Array.from({length: 34}, (_, i) => `eyes_female/eyes_${String(i+1).padStart(2, '0')}.png`),
  hair_b: Array.from({length: 7}, (_, i) => `hair_b/hrb_${String(i+1).padStart(2, '0')}.png`),
  hair_f_female: Array.from({length: 17}, (_, i) => `hair_f/female/hrf_${String(i+1).padStart(2, '0')}.png`),
  hair_f_male: Array.from({length: 13}, (_, i) => `hair_f/male/hrf_${String(i+1).padStart(2, '0')}.png`),
  head: ['head/head.png'],
  mouth: Array.from({length: 31}, (_, i) => `mouth/mouth_${String(i+1).padStart(2, '0')}.png`)
};

const loadImg = (url) => new Promise((resolve) => { 
  const img = new Image(); 
  img.onload = () => resolve(img); 
  img.onerror = () => {
    const canvasFallback = document.createElement("canvas");
    canvasFallback.width = 256; canvasFallback.height = 256;
    resolve(canvasFallback);
  };
  img.src = url; 
});

async function loadAssets() {
  const loadingOverlay = document.getElementById("loadingOverlay");
  const loadingBar = document.getElementById("loadingBar");
  const loadingText = document.getElementById("loadingText");
  
  const totalAssets = TOTAL_TEXTURES + Object.values(assetList).flat().length;
  let loaded = 0;
  
  const updateProgress = () => {
    loaded++;
    const percent = Math.min(100, Math.floor((loaded / totalAssets) * 100));
    loadingBar.style.width = percent + "%";
    loadingText.textContent = `${t('loadingPrefix')} ${percent}%`;
  };

  const loadWithProgress = async (url) => {
    const img = await loadImg(url);
    updateProgress();
    return img;
  };

  const texturePromises = Array.from({length: TOTAL_TEXTURES}, (_, i) => {
    return loadWithProgress(`img_${String(i+1).padStart(2, '0')}.png`);
  });

  const partPromises = {};
  for (const category in assetList) {
    partPromises[category] = Promise.all(assetList[category].map(loadWithProgress));
  }

  const resolvedTextures = await Promise.all(texturePromises);
  loadedTextures = resolvedTextures.map(img => ctx.createPattern(img, "repeat"));

  for (const category in assetList) {
    loadedParts[category] = await partPromises[category];
  }

  setTimeout(() => {
    loadingOverlay.classList.add("hidden");
  }, 400);

  isAppReady = true;
  statusInfo.innerHTML = t('loadingReady');
}

const palettes = {
  skin: [ { base: "#ffead1", dark: "#eac09d", blush: "#ffc4b8" }, { base: "#fde2cd", dark: "#d9ae87", blush: "#fba9a1" }, { base: "#e2b896", dark: "#bf8e6a", blush: "#d28174" }, { base: "#c8946e", dark: "#a36c4b", blush: "#a66155" }, { base: "#a8e6cf", dark: "#74c69d", blush: "#dcedc1" }, { base: "#cad2c5", dark: "#84a98c", blush: "#a3b18a" }, { base: "#9bf6ff", dark: "#48cae4", blush: "#caf0f8" }, { base: "#e0b1cb", dark: "#9f86c0", blush: "#f3d2c1" } ],
  themes: [ { main: "#1e293b", sec: "#0f172a", hair: "#111827", hDark: "#030712" }, { main: "#3b82f6", sec: "#1d4ed8", hair: "#3f2814", hDark: "#241408" }, { main: "#10b981", sec: "#047857", hair: "#d97706", hDark: "#b45309" }, { main: "#f43f5e", sec: "#be123c", hair: "#7e22ce", hDark: "#581c87" }, { main: "#f472b6", sec: "#db2777", hair: "#f59e0b", hDark: "#d97706" }, { main: "#fb923c", sec: "#c2410c", hair: "#475569", hDark: "#334155" }, { main: "#2dd4bf", sec: "#0f766e", hair: "#be185d", hDark: "#831843" }, { main: "#818cf8", sec: "#4f46e5", hair: "#e11d48", hDark: "#9f1239" } ]
};

function invertHexColor(hex) {
  hex = hex.replace('#', '');
  let r = (255 - parseInt(hex.substring(0, 2), 16)).toString(16).padStart(2, '0');
  let g = (255 - parseInt(hex.substring(2, 4), 16)).toString(16).padStart(2, '0');
  let b = (255 - parseInt(hex.substring(4, 6), 16)).toString(16).padStart(2, '0');
  return '#' + r + g + b;
}

class PRNG {
  constructor(seedStr) { this.seed = this.hashString(seedStr); }
  hashString(str) {
    let h = 2166136261;
    for(let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24); }
    return h >>> 0;
  }
  next() { this.seed = (this.seed * 1664525 + 1013904223) >>> 0; return this.seed / 4294967296; }
}

let currentConfig = {};
let currentSeedName = "";
let batchImagesData = [];

function drawPart(imgElement, color, texture = null) {
  if (!imgElement) return;
  offCtx.clearRect(0, 0, 256, 256);
  offCtx.globalCompositeOperation = 'source-over';
  offCtx.fillStyle = color || "#ffffff";
  offCtx.fillRect(0, 0, 256, 256);

  if (texture) {
    offCtx.fillStyle = texture;
    offCtx.globalAlpha = 0.55;
    offCtx.fillRect(0, 0, 256, 256);
    offCtx.globalAlpha = 1.0;
  }

  offCtx.globalCompositeOperation = 'destination-in';
  offCtx.drawImage(imgElement, 0, 0, 256, 256);
  offCtx.globalCompositeOperation = 'multiply';
  offCtx.drawImage(imgElement, 0, 0, 256, 256);
  ctx.drawImage(offCanvas, 0, 0, canvas.width, canvas.height);
}

function drawAvatar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const skin = palettes.skin[currentConfig.skinIdx];
  const theme = palettes.themes[currentConfig.themeIdx];
  const fabricTex = loadedTextures.length ? loadedTextures[currentConfig.texFabricIdx] : null;
  const hairTex = loadedTextures.length ? loadedTextures[currentConfig.texHairIdx] : null;
  const paperTex = loadedTextures.length ? loadedTextures[currentConfig.texPaperIdx] : null;

  const bgInvMain = invertHexColor(theme.main);
  const bgInvSec = invertHexColor(theme.sec);
  const bgGrd = ctx.createRadialGradient(128, 128, 0, 128, 128, 200);
  bgGrd.addColorStop(0, bgInvMain); bgGrd.addColorStop(1, bgInvSec);
  ctx.fillStyle = bgGrd; 
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  if (paperTex) {
    ctx.globalAlpha = 0.35; 
    ctx.fillStyle = paperTex; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1.0;
  }
  
  if(currentConfig.hairBIdx !== -1 && loadedParts.hair_b[currentConfig.hairBIdx]) drawPart(loadedParts.hair_b[currentConfig.hairBIdx], theme.hDark, hairTex);
  if(loadedParts.head[0]) drawPart(loadedParts.head[0], skin.base);
  if(loadedParts.body[currentConfig.bodyIdx]) drawPart(loadedParts.body[currentConfig.bodyIdx], theme.main, fabricTex);
  
  if (currentConfig.isFemale) {
    if(loadedParts.eyes_female[currentConfig.eyeIdx]) drawPart(loadedParts.eyes_female[currentConfig.eyeIdx], "#ffffff");
  } else {
    if(loadedParts.eyes_male[currentConfig.eyeIdx]) drawPart(loadedParts.eyes_male[currentConfig.eyeIdx], "#ffffff");
  }

  if(loadedParts.mouth[currentConfig.mouthIdx]) drawPart(loadedParts.mouth[currentConfig.mouthIdx], "#ffffff");

  if (currentConfig.isFemale) {
    if(loadedParts.hair_f_female[currentConfig.hairFIdx]) drawPart(loadedParts.hair_f_female[currentConfig.hairFIdx], theme.hair, hairTex);
  } else {
    if(loadedParts.hair_f_male[currentConfig.hairFIdx]) drawPart(loadedParts.hair_f_male[currentConfig.hairFIdx], theme.hair, hairTex);
  }

  displayUsername.textContent = `@${currentSeedName.toLowerCase()}`;
}

function applySeed(seedStr) {
  if (!seedStr) seedStr = "OrangAsing"; 
  currentSeedName = seedStr;
  if (document.activeElement !== seedInput) seedInput.value = seedStr; 
  
  const rng = new PRNG(seedStr);
  const isFemale = rng.next() > 0.5;
  let hairBIndex = -1, hairFIndex = 0, eyeIndex = 0;

  if (isFemale) {
    hairBIndex = Math.floor(rng.next() * Math.max(1, loadedParts.hair_b.length));
    hairFIndex = Math.floor(rng.next() * Math.max(1, loadedParts.hair_f_female.length));
    eyeIndex = Math.floor(rng.next() * Math.max(1, loadedParts.eyes_female.length));
  } else {
    hairFIndex = Math.floor(rng.next() * Math.max(1, loadedParts.hair_f_male.length));
    eyeIndex = Math.floor(rng.next() * Math.max(1, loadedParts.eyes_male.length));
  }

  currentConfig = {
    isFemale: isFemale, 
    skinIdx: Math.floor(rng.next() * palettes.skin.length),
    themeIdx: Math.floor(rng.next() * palettes.themes.length),
    bodyIdx: Math.floor(rng.next() * Math.max(1, loadedParts.body.length)),
    eyeIdx: eyeIndex,
    mouthIdx: Math.floor(rng.next() * Math.max(1, loadedParts.mouth.length)),
    hairBIdx: hairBIndex, hairFIdx: hairFIndex,
    texFabricIdx: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES)),
    texHairIdx: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES)),
    texPaperIdx: Math.floor(rng.next() * Math.max(1, TOTAL_TEXTURES))
  };
  drawAvatar();
}

seedInput.addEventListener("input", (e) => applySeed(e.target.value));

function generateRandomName() {
  const kons = "bcdfghjklmnprstvwxyz", voks = "aeiou";
  let name = "";
  for(let i=0; i<6; i++) name += i%2===0 ? kons[Math.floor(Math.random()*kons.length)] : voks[Math.floor(Math.random()*voks.length)];
  return name.charAt(0).toUpperCase() + name.slice(1) + Math.floor(10+Math.random()*89);
}

function generateRandom() { applySeed(generateRandomName()); }

function getHDCanvasData() {
  const hdCanvas = document.createElement("canvas");
  hdCanvas.width = 1024; hdCanvas.height = 1024;
  const hdCtx = hdCanvas.getContext("2d");
  
  hdCtx.fillStyle = "#FFFFFF";
  hdCtx.fillRect(0, 0, 1024, 1024);
  hdCtx.imageSmoothingEnabled = false; 
  hdCtx.drawImage(canvas, 0, 0, 1024, 1024);
  
  hdCtx.imageSmoothingEnabled = true;
  const watermarkText = "ID: " + currentSeedName;
  hdCtx.font = "bold 28px 'Fredoka', sans-serif";
  hdCtx.textAlign = "right";
  hdCtx.textBaseline = "bottom";
  
  hdCtx.fillStyle = "#000000";
  hdCtx.fillText(watermarkText, 1024 - 17, 1024 - 17);
  hdCtx.fillStyle = "#FFDE59";
  hdCtx.fillText(watermarkText, 1024 - 20, 1024 - 20);

  return hdCanvas.toDataURL("image/jpeg", 0.95);
}

function downloadImage() {
  const name = currentSeedName || 'Muka_Kartun';
  const link = document.createElement("a");
  link.download = `${name}_SuperHD.jpg`; 
  link.href = getHDCanvasData();
  link.click();
}

function updateBatchCount(change) {
  const input = document.getElementById("batchCount");
  let currentValue = parseInt(input.value) || 5;
  const min = parseInt(input.min) || 2;
  const max = parseInt(input.max) || 27; 
  let newValue = currentValue + change;
  if(newValue >= min && newValue <= max) input.value = newValue;
}

function prepareBatch() {
  const btn = document.getElementById("btnGenerateBatch");
  const originalText = btn.innerHTML;
  
  btn.innerHTML = t('batchThinking');
  btn.disabled = true;

  setTimeout(() => {
    const batchCount = parseInt(document.getElementById("batchCount").value) || 5;
    const grid = document.getElementById("previewGrid");
    grid.innerHTML = "";
    batchImagesData = [];

    for (let i = 0; i < batchCount; i++) {
      const randomName = generateRandomName();
      applySeed(randomName); 
      
      const dataURL = getHDCanvasData();
      const base64Data = dataURL.split(',')[1];
      
      batchImagesData.push({ name: randomName, data: base64Data });
      
      const img = document.createElement("img");
      img.src = dataURL;
      grid.appendChild(img);
    }
    
    const modal = document.getElementById("previewModal");
    modal.classList.add("active");
    
    btn.innerHTML = originalText;
    btn.disabled = false;
  }, 2000); 
}

function closePreview() {
  const modal = document.getElementById("previewModal");
  modal.classList.remove("active");
  generateRandom();
}

async function downloadBatchImages() {
  const btn = document.getElementById("btnDownloadBatch");
  btn.innerHTML = t('batchDownloading');
  btn.disabled = true;

  for (let i = 0; i < batchImagesData.length; i++) {
    const item = batchImagesData[i];
    const link = document.createElement("a");
    link.href = "data:image/jpeg;base64," + item.data;
    link.download = `${item.name}_SuperHD.jpg`;
    
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    await new Promise(resolve => setTimeout(resolve, 300));
  }
  
  btn.innerHTML = t('batchDone');
  setTimeout(() => {
    btn.innerHTML = t('btnDownloadAll');
    btn.disabled = false;
    closePreview();
  }, 1500);
}

// Inisialisasi saat window dimuat
window.onload = async () => {
  const savedLang = localStorage.getItem('pabrikKartunLang');
  if (!savedLang) {
    document.getElementById('langModal').classList.add('active');
  } else {
    applyTranslations(savedLang);
  }
  applyTranslations(savedLang || 'id'); // Set string default
  await loadAssets(); 
  generateRandom();
};

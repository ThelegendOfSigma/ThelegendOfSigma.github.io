<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iNviNiv</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    @font-face {
      font-family: 'FontSatu';
      src: url('font_1.otf') format('opentype');
    }
    @font-face {
      font-family: 'FontDua';
      src: url('font_2.otf') format('opentype');
    }

    :root {
      --bg-main: #38BDF8;
      --card-bg: #FFFFFF;
      --border-color: #1e1e1e;
      --text-primary: #1e1e1e;
      --text-secondary: #4b5563;
      --accent: #FFDE59;
      --accent-hover: #fcd336;
      --btn-primary: #FF5757;
      --btn-primary-hover: #e04141;
      --btn-success: #10b981;
      --border-thick: 3px solid var(--border-color);
      --shadow-chunky: 4px 4px 0px var(--border-color);
      --shadow-hover: 6px 6px 0px var(--border-color);
      --radius-lg: 16px;
      --radius-md: 10px;
    }
    
    body {
      box-sizing: border-box; 
      font-family: 'FontSatu', sans-serif; 
      margin: 0; padding: 0;
      background-color: var(--bg-main);
      background-image: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 80px;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    h1, h2, .post-name, button, .app-header h1 {
      font-family: 'FontDua', sans-serif;
    }

    .container { max-width: 600px; margin: 0 auto; padding: 12px; }

    .card {
      background: var(--card-bg); border: var(--border-thick);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-chunky);
      padding: 16px; margin-bottom: 20px;
    }

    h2 { text-align: center; margin-top: 0; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }

    .input-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .input-label { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }
    
    input, textarea {
      width: 100%; padding: 12px 14px; background: #FFF;
      border: var(--border-thick); border-radius: var(--radius-md); font-size: 15px;
      font-weight: 500; font-family: inherit; box-sizing: border-box; outline: none;
      transition: all 0.2s ease;
    }
    input:focus, textarea:focus { background: #FFFBEB; box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05), 0 0 0 3px var(--accent); }
    input[readonly] { background: #e5e7eb; color: #6b7280; cursor: not-allowed; }
    textarea { resize: vertical; min-height: 80px; }

    .custom-select { position: relative; width: 100%; user-select: none; }
    .custom-select-trigger {
      width: 100%; padding: 12px 14px; background: #FFF;
      border: var(--border-thick); border-radius: var(--radius-md); font-size: 15px;
      font-weight: 600; cursor: pointer; display: flex; justify-content: space-between;
      align-items: center; box-sizing: border-box; transition: all 0.2s ease;
    }
    .custom-select-trigger:hover { background: var(--accent); box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05); }
    .custom-select-options {
      position: absolute; top: 100%; left: 0; right: 0; background: #FFF;
      border: var(--border-thick); border-radius: var(--radius-md); box-shadow: var(--shadow-chunky);
      margin-top: 6px; z-index: 100; display: none; max-height: 200px; overflow-y: auto;
    }
    .custom-select.open .custom-select-options { display: block; animation: popIn 0.2s ease-out; }
    .custom-option {
      padding: 12px 14px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 2px solid #f3f4f6;
    }
    .custom-option:last-child { border-bottom: none; }
    .custom-option:hover { background: var(--accent); color: var(--text-primary); }
    
    .feed-controls .custom-select-trigger { padding: 8px 12px; font-size: 13px; font-weight: 700; background: #f9fafb; }

    button {
      width: 100%; padding: 12px; background: var(--accent); color: var(--text-primary);
      border: var(--border-thick); border-radius: var(--radius-md); font-size: 15px;
      font-weight: 700; cursor: pointer; text-transform: uppercase;
      box-shadow: var(--shadow-chunky); transition: all 0.1s ease; margin-bottom: 10px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-hover); background: var(--accent-hover); }
    button:active:not(:disabled) { transform: translateY(4px) translateX(4px); box-shadow: 0px 0px 0px var(--border-color); }
    button:disabled { opacity: 0.7; cursor: not-allowed; box-shadow: 0 0 0 var(--border-color); transform: none; }
    
    button.primary { background: var(--btn-primary); color: #FFF; }
    button.primary:hover:not(:disabled) { background: var(--btn-primary-hover); }
    button.success { background: var(--btn-success); color: #FFF; }
    button.small-btn { padding: 6px 10px; font-size: 12px; width: auto; margin-bottom: 0; box-shadow: 2px 2px 0px var(--border-color); }
    
    .hidden { display: none !important; }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast-msg {
      background: var(--card-bg); border: var(--border-thick); border-radius: var(--radius-md);
      box-shadow: var(--shadow-chunky); padding: 12px 16px; font-size: 14px; font-weight: 700;
      color: var(--text-primary); transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: auto; display: flex; align-items: center; gap: 8px;
    }
    .toast-msg.show { transform: translateX(0); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 2000;
      display: flex; justify-content: center; align-items: center; padding: 16px;
      overflow-y: auto; opacity: 1; transition: opacity 0.2s ease;
    }
    .modal-card { width: 100%; max-width: 400px; animation: popIn 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    #lightbox-img { max-width: 100%; max-height: 80vh; border: var(--border-thick); border-radius: var(--radius-md); box-shadow: var(--shadow-chunky); }

    .app-header-wrapper { position: sticky; top: 12px; z-index: 1000; margin-bottom: 20px; }
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: var(--border-thick); border-radius: var(--radius-lg);
      padding: 10px 14px; box-shadow: var(--shadow-chunky);
    }
    .app-header h1 { margin: 0; font-size: 22px; color: var(--btn-primary); text-transform: uppercase; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; text-shadow: 1px 1px 0px var(--border-color); }
    
    .header-logo { width: 28px; height: 28px; object-fit: contain; border: 2px solid var(--border-color); border-radius: 6px; box-shadow: 2px 2px 0px var(--border-color); background: #fff; }

    .header-actions { display: flex; gap: 10px; align-items: center; }

    .feed-controls {
      display: flex; gap: 8px; align-items: center; margin-bottom: 16px; background: var(--card-bg);
      border: var(--border-thick); border-radius: var(--radius-lg); padding: 10px 14px; box-shadow: var(--shadow-chunky);
    }

    .upload-wrapper { display: flex; flex-direction: column; gap: 8px; }
    .image-upload-btn {
      background: #e0e7ff; color: #4338ca; border: 2px dashed #4338ca; border-radius: var(--radius-md);
      padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.1s ease;
      margin-bottom: 10px; width: 100%; box-sizing: border-box;
    }
    .image-upload-btn:hover { background: #c7d2fe; }
    #upload-status { font-size: 12px; font-weight: 700; margin-top: -6px; margin-bottom: 10px; display: none; text-align: center; }

    .compose-preview-area { position: relative; display: none; margin-bottom: 12px; width: fit-content; }
    .compose-preview-img { max-height: 120px; border-radius: 8px; border: 2px solid var(--border-color); box-shadow: 2px 2px 0px var(--border-color); object-fit: cover; }
    .btn-remove-img {
      position: absolute; top: -8px; right: -8px; background: var(--btn-primary); color: white;
      border: 2px solid var(--border-color); border-radius: 50%; width: 24px; height: 24px;
      font-weight: bold; font-size: 12px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; padding: 0; box-shadow: 2px 2px 0px var(--border-color); margin: 0;
    }

    .post-card {
      background: var(--card-bg); border: var(--border-thick); border-radius: var(--radius-lg);
      box-shadow: 3px 3px 0px var(--border-color); padding: 16px; margin-bottom: 24px;
      transition: transform 0.2s;
    }
    .post-card:hover { transform: translateY(-2px); }
    .post-top { display: flex; gap: 12px; }
    .post-avatar {
      width: 50px; height: 50px; border-radius: 14px; border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--border-color); flex-shrink: 0; background: #f3f4f6; object-fit: cover; cursor: pointer;
    }
    .post-content { flex: 1; min-width: 0; }
    .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    
    .post-name-area { display: flex; flex-direction: column; cursor: pointer; }
    .post-name { font-weight: 700; font-size: 16px; color: var(--btn-primary); }
    .post-name:hover { text-decoration: underline; }
    .post-time { font-size: 12px; color: #6b7280; font-weight: 500; margin-top: 2px; }
    
    .post-menu { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .post-menu-btn {
      background: transparent; color: var(--text-secondary); border: 2px solid transparent; border-radius: 6px;
      font-size: 11px; padding: 4px 8px; cursor: pointer; font-weight: bold; margin-bottom: 0; box-shadow: none;
    }
    .post-menu-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
    .btn-delete-post { color: var(--btn-primary); }
    .btn-delete-post:hover { background: #fee2e2; border-color: #fca5a5; }

    .add-friend-btn {
      background: #e0e7ff; color: #4338ca; border: 2px solid #4338ca; border-radius: 6px;
      font-size: 11px; padding: 2px 8px; cursor: pointer; font-weight: bold; margin-top: 4px;
      display: inline-block; width: fit-content; text-transform: none; box-shadow: 2px 2px 0px #4338ca;
    }
    .add-friend-btn:active { box-shadow: 0 0 0; transform: translate(2px, 2px); }

    .post-text { font-size: 15px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; margin-bottom: 12px; }
    
    .post-image-preview {
      width: 100%; max-height: 400px; object-fit: cover; border-radius: var(--radius-md);
      border: 2px solid var(--border-color); margin-bottom: 12px; background: #f3f4f6; cursor: pointer;
    }

    .action-bar { display: flex; gap: 8px; flex-wrap: wrap; border-top: 2px solid #f3f4f6; border-bottom: 2px solid #f3f4f6; padding: 12px 0; margin-bottom: 12px; justify-content: space-between; align-items: center; }
    .reaction-group { display: flex; gap: 6px; }
    
    .reaction-btn {
      border: 2px solid var(--border-color); border-radius: 8px;
      padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; box-shadow: 2px 2px 0px var(--border-color);
      width: auto; margin: 0; text-transform: none; transition: transform 0.1s;
    }
    .reaction-btn:hover { transform: translateY(-2px); }
    
    .btn-react-like { background: #fef08a; } 
    .btn-react-like.active { background: #eab308; color: #fff; }

    .btn-react-meh { background: #bae6fd; } 
    .btn-react-meh.active { background: #0284c7; color: #fff; }

    .btn-react-wuttafak { background: #fecaca; } 
    .btn-react-wuttafak.active { background: #dc2626; color: #fff; }

    .reaction-icon-img { width: 18px; height: 18px; object-fit: contain; }
    .btn-share { background: #fff; box-shadow: none; border-color: #d1d5db; font-size: 12px; }

    .comments-section { margin-top: 8px; }
    .comments-list-wrapper { max-height: 300px; overflow-y: auto; padding-right: 4px; margin-bottom: 12px; }
    .comments-list-wrapper::-webkit-scrollbar { width: 4px; }
    .comments-list-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .comment-item { margin-bottom: 12px; position: relative; display: flex; flex-direction: column; align-items: flex-start; }
    .comment-bubble { 
      background: #f3f4f6; padding: 10px 14px; border-radius: 18px; border-top-left-radius: 4px; 
      font-size: 14px; color: var(--text-primary); display: inline-block; max-width: 90%;
    }
    .comment-header { font-weight: 700; font-size: 13px; color: var(--text-primary); margin-bottom: 4px; display: block; }
    
    .comment-actions { margin-top: 4px; margin-left: 8px; display: flex; gap: 12px; }
    .reply-btn-text, .delete-comment-btn {
      font-size: 11px; font-weight: bold; cursor: pointer; background: none; border: none; 
      padding: 0; box-shadow: none; width: auto; display: inline; text-transform: none; margin: 0;
    }
    .reply-btn-text { color: #6b7280; }
    .reply-btn-text:hover { color: var(--btn-primary); text-decoration: underline; }
    .delete-comment-btn { color: #ef4444; }

    .comment-item.is-reply { margin-left: 24px; margin-top: 4px; }
    .comment-item.is-reply .comment-bubble { border-radius: 18px; border-top-left-radius: 18px; border-bottom-left-radius: 4px; background: #e0f2fe; }

    .comment-input-box { display: flex; gap: 8px; align-items: center; }
    .comment-input-box input { padding: 10px 14px; font-size: 13px; border-width: 2px; border-radius: 20px; margin: 0; flex: 1; }
    .comment-input-box button { padding: 10px 14px; font-size: 13px; border-radius: 20px; width: auto; margin: 0; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg);
      border-top: var(--border-thick); display: flex; justify-content: space-around;
      padding: 12px 0; z-index: 1000;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
      font-size: 12px; font-weight: 700; color: var(--text-secondary); cursor: pointer; text-decoration: none;
    }
    .nav-item:hover, .nav-item.active { color: var(--btn-primary); }
    
    .nav-badge {
      position: absolute; top: -6px; right: 8px; background: #ef4444; color: white;
      border: 2px solid var(--border-color); border-radius: 50%; font-size: 10px;
      font-weight: 800; width: 16px; height: 16px; display: flex; align-items: center;
      justify-content: center; box-shadow: 2px 2px 0px var(--border-color);
    }

    .svg-icon { width: 18px; height: 18px; fill: currentColor; display: inline-block; vertical-align: middle; }
    .svg-icon-lg { width: 24px; height: 24px; }
    
    #loadingOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(56, 189, 248, 0.98);
      z-index: 3000; display: flex; flex-direction: column; justify-content: center; align-items: center;
    }

    .flatpickr-calendar {
      font-family: 'FontSatu', sans-serif !important;
      border: var(--border-thick) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: var(--shadow-chunky) !important;
      background: var(--card-bg) !important;
    }
    .flatpickr-day.selected {
      background: var(--btn-primary) !important;
      border-color: var(--border-color) !important;
    }
  </style>
</head>
<body>

  <div id="toast-container" class="toast-container"></div>

  <div id="loadingOverlay">
    <h2 style="color: white; text-shadow: 2px 2px 0px #000; font-size: 24px;">Menyiapkan iNviNiv...</h2>
  </div>
  <canvas id="hiddenCanvas" width="256" height="256" style="display: none;"></canvas>

  <div id="custom-confirm-modal" class="modal-overlay hidden">
    <div class="card modal-card" style="text-align: center;">
      <h2 id="custom-confirm-text" style="margin-bottom: 20px;">Apakah kamu yakin?</h2>
      <div style="display: flex; gap: 10px;">
        <button class="primary" id="btn-confirm-yes">Ya, Lanjutkan</button>
        <button id="btn-confirm-no" style="background: #e5e7eb; color: #374151;">Batal</button>
      </div>
    </div>
  </div>

  <div id="auth-modal" class="modal-overlay hidden">
    <div class="card modal-card">
      <div id="login-box">
        <h2>Masuk iNviNiv</h2>
        <p id="login-status" style="color: red; text-align: center; font-weight: bold; font-size: 13px;"></p>
        <div class="input-group">
          <input type="email" id="login-email" placeholder="Email">
          <input type="password" id="login-password" placeholder="Password">
        </div>
        <button class="primary" id="btn-login">Masuk</button>
        <button id="toggle-to-register" style="background: #e5e7eb; color: #374151;">Buat Akun Baru</button>
      </div>

      <div class="hidden" id="register-box">
        <h2>Daftar Akun Baru</h2>
        <p id="reg-status" style="color: red; text-align: center; font-weight: bold; font-size: 13px;"></p>
        <div class="input-group">
          <select id="reg-gender" class="custom-dropdown"><option value="Laki-laki">Cowok</option><option value="Perempuan">Cewek</option></select>
          <input type="text" id="reg-name" maxlength="20" placeholder="Username (Maks 20 Huruf)" autocomplete="off">
          <input type="email" id="reg-email" readonly placeholder="Email Otomatis (Anti-Ribet)">
          <input type="password" id="reg-password" placeholder="Password (Min 6 Karakter)">
        </div>
        <button class="primary" id="btn-register">Daftar & Bikin Avatar</button>
        <button id="toggle-to-login" style="background: #e5e7eb; color: #374151;">Sudah Punya Akun?</button>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal-overlay hidden">
    <div class="card modal-card">
      <h2>Edit Profilmu</h2>
      <p style="font-size: 12px; text-align:center; color: #6b7280; margin-top:-10px; margin-bottom: 16px;">(Nama batas maks 2x/bulan)</p>
      
      <div class="input-group" style="align-items: center; text-align: center;">
        <label class="input-label">Foto Profil Pribadi</label>
        <img id="profile-modal-preview" src="" style="width: 80px; height: 80px; border-radius: 16px; border: var(--border-thick); object-fit: cover; margin-bottom: 8px;">
        <label for="profile-pic-upload" class="image-upload-btn" style="margin-bottom: 0; width: auto; padding: 6px 12px; font-size: 12px;"> Unggah Foto Sendiri</label>
        <input type="file" id="profile-pic-upload" accept="image/*" class="hidden">
        <input type="hidden" id="profile-custom-avatar-url">
        <button type="button" class="small-btn" id="btn-reset-avatar" style="background:#e5e7eb; margin-top: 6px;">Reset ke Avatar Generator</button>
      </div>

      <div class="input-group">
        <label class="input-label">Username (Maks 20)</label>
        <input type="text" id="edit-name" maxlength="20">
      </div>
      <div class="input-group">
        <label class="input-label">Jenis Kelamin</label>
        <select id="edit-gender" class="custom-dropdown"><option value="Laki-laki">Cowok</option><option value="Perempuan">Cewek</option></select>
      </div>
      <div class="input-group">
        <label class="input-label">Tanggal Lahir</label>
        <input type="text" id="edit-dob" placeholder="Pilih Tanggal Lahir">
      </div>
      <div class="input-group">
        <label class="input-label">Tempat Tinggal</label>
        <input type="text" id="edit-location" placeholder="Cth: Bekasi Planet Lain">
      </div>
      <div class="input-group">
        <label class="input-label">Bio Singkat</label>
        <textarea id="edit-bio" placeholder="Tulis sesuatu yang aneh tentangmu..."></textarea>
      </div>
      <button class="primary" id="btn-save-profile">Simpan Perubahan</button>
      <button onclick="document.getElementById('profile-modal').classList.add('hidden')" style="background: #e5e7eb; color: #374151;">Batal</button>
    </div>
  </div>

  <div id="public-profile-modal" class="modal-overlay hidden">
    <div class="card modal-card" style="text-align: center;">
      <img id="pub-avatar" src="" style="width: 100px; height: 100px; border-radius: 24px; border: var(--border-thick); margin-bottom: 10px; object-fit: cover;">
      <h2 id="pub-name" style="margin-bottom: 4px; color: var(--btn-primary);"></h2>
      <p id="pub-location" style="font-size: 13px; color: gray; margin-top: 0;"></p>
      <div style="background: #f9fafb; padding: 12px; border-radius: 8px; border: 2px solid #e5e7eb; text-align: left; margin-bottom: 16px;">
        <p style="font-size: 12px; font-weight: bold; margin:0 0 4px 0; color: gray;">BIO</p>
        <p id="pub-bio" style="font-size: 14px; margin: 0; font-style: italic;"></p>
      </div>
      <button onclick="document.getElementById('public-profile-modal').classList.add('hidden')" style="background: #e5e7eb; color: #374151;">Tutup</button>
    </div>
  </div>

  <div id="edit-post-modal" class="modal-overlay hidden">
    <div class="card modal-card">
      <h2>Edit Postingan</h2>
      <input type="hidden" id="edit-post-id">
      <div class="input-group">
        <textarea id="edit-post-content" style="min-height: 120px;"></textarea>
      </div>
      <button class="primary" id="btn-save-edit-post">Simpan</button>
      <button onclick="document.getElementById('edit-post-modal').classList.add('hidden')" style="background: #e5e7eb; color: #374151;">Batal</button>
    </div>
  </div>

  <div id="friends-modal" class="modal-overlay hidden">
    <div class="card modal-card">

    window.customAlert = function(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast-msg';
      toast.innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24" style="color:var(--btn-primary);"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> ${message}`;
      container.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    };

    window.customConfirm = function(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('custom-confirm-modal');
        const textEl = document.getElementById('custom-confirm-text');
        const btnYes = document.getElementById('btn-confirm-yes');
        const btnNo = document.getElementById('btn-confirm-no');

        textEl.innerText = message;
        modal.classList.remove('hidden');

        const handleYes = () => {
          cleanup();
          resolve(true);
        };

        const handleNo = () => {
          cleanup();
          resolve(false);
        };

        const cleanup = () => {
          modal.classList.add('hidden');
          btnYes.removeEventListener('click', handleYes);
          btnNo.removeEventListener('click', handleNo);
        };

        btnYes.addEventListener('click', handleYes);
        btnNo.addEventListener('click', handleNo);
      });
    };

    function initCustomDropdowns() {
      document.querySelectorAll('select.custom-dropdown').forEach(select => {
        if (select.dataset.initialized) return;
        select.dataset.initialized = "true";

        const wrapper = document.createElement('div');
        wrapper.className = 'custom-select';
        
        const trigger = document.createElement('div');
        trigger.className = 'custom-select-trigger';
        trigger.innerHTML = `<span>${select.options[select.selectedIndex].text}</span> <span>▼</span>`;
        
        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'custom-select-options';
        
        Array.from(select.options).forEach(opt => {
          const optionDiv = document.createElement('div');
          optionDiv.className = 'custom-option';
          optionDiv.innerText = opt.text;
          optionDiv.addEventListener('click', (e) => {
            select.value = opt.value;
            trigger.querySelector('span').innerText = opt.text;
            wrapper.classList.remove('open');
            select.dispatchEvent(new Event('change'));
          });
          optionsContainer.appendChild(optionDiv);
        });
        
        wrapper.appendChild(trigger);
        wrapper.appendChild(optionsContainer);
        
        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.custom-select').forEach(c => {
            if(c !== wrapper) c.classList.remove('open');
          });
          wrapper.classList.toggle('open');
        });
        
        select.parentNode.insertBefore(wrapper, select);
        select.style.display = 'none';
      });
      
      document.addEventListener('click', () => {
        document.querySelectorAll('.custom-select').forEach(c => c.classList.remove('open'));
      });
    }

    function timeAgo(timestamp) {
      if (!timestamp) return "Baru saja";
      const seconds = Math.floor((new Date() - timestamp.toDate()) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + " thn";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + " bln";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + " hri";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + " jam";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + " mnt";
      return "Baru saja";
    }

    const canvas = document.getElementById("hiddenCanvas");
    const ctx = canvas.getContext("2d");
    const offCanvas = document.createElement("canvas"); offCanvas.width = 256; offCanvas.height = 256; const offCtx = offCanvas.getContext("2d");
    
    let loadedTextures = []; let loadedParts = { body: [], eyes_male: [], eyes_female: [], hair_b: [], hair_f_female: [], hair_f_male: [], head: [], mouth: [] };
    const assetList = { body: Array.from({length: 12}, (_, i) => `body/body_${String(i+1).padStart(2, '0')}.png`), eyes_male: Array.from({length: 30}, (_, i) => `eyes_male/eyes_${String(i+1).padStart(2, '0')}.png`), eyes_female: Array.from({length: 34}, (_, i) => `eyes_female/eyes_${String(i+1).padStart(2, '0')}.png`), hair_b: Array.from({length: 7}, (_, i) => `hair_b/hrb_${String(i+1).padStart(2, '0')}.png`), hair_f_female: Array.from({length: 20}, (_, i) => `hair_f/female/hrf_${String(i+1).padStart(2, '0')}.png`), hair_f_male: Array.from({length: 18}, (_, i) => `hair_f/male/hrf_${String(i+1).padStart(2, '0')}.png`), head: ['head/head.png'], mouth: Array.from({length: 31}, (_, i) => `mouth/mouth_${String(i+1).padStart(2, '0')}.png`) };
    const loadImg = (url) => new Promise((res) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => { const c = document.createElement("canvas"); c.width=256; c.height=256; res(c); }; img.src = url; });
    
    async function initGenerator() {
      const texPromises = []; for(let i=1; i<=29; i++) texPromises.push(loadImg(`img_${String(i).padStart(2, '0')}.png`));
      const partPromises = {}; for(const cat in assetList) partPromises[cat] = Promise.all(assetList[cat].map(loadImg));
      loadedTextures = (await Promise.all(texPromises)).map(img => ctx.createPattern(img, "repeat"));
      for(const cat in assetList) loadedParts[cat] = await partPromises[cat];
      
      initCustomDropdowns();
      flatpickr("#edit-dob", {
        dateFormat: "Y-m-d",
        disableMobile: "true",
        allowInput: true
      });

      document.getElementById("loadingOverlay").classList.add("hidden");
    }

    const palettes = { skin: [{base:"#ffead1", dark:"#eac09d"},{base:"#fde2cd", dark:"#d9ae87"}], themes: [{main:"#1e293b", sec:"#0f172a", hair:"#111827", hDark:"#030712"}, {main:"#3b82f6", sec:"#1d4ed8", hair:"#3f2814", hDark:"#241408"}] };
    function invertHexColor(hex) { hex = hex.replace('#', ''); return '#' + (255-parseInt(hex.substring(0,2),16)).toString(16).padStart(2,'0') + (255-parseInt(hex.substring(2,4),16)).toString(16).padStart(2,'0') + (255-parseInt(hex.substring(4,6),16)).toString(16).padStart(2,'0'); }
    class PRNG { constructor(s) { this.seed = 2166136261; for(let i=0; i<s.length; i++) { this.seed ^= s.charCodeAt(i); this.seed += (this.seed<<1)+(this.seed<<4)+(this.seed<<7)+(this.seed<<8)+(this.seed<<24); } this.seed >>>= 0; } next() { this.seed = (this.seed*1664525 + 1013904223)>>>0; return this.seed/4294967296; } }
    
    function drawPart(img, color, tex=null) {
      if(!img) return; if((!color||color==="#ffffff") && !tex) { ctx.globalCompositeOperation='source-over'; ctx.drawImage(img,0,0,256,256); return; }
      offCtx.clearRect(0,0,256,256); offCtx.globalCompositeOperation='source-over'; offCtx.drawImage(img,0,0,256,256);
      if(color&&color!=="#ffffff"){ offCtx.globalCompositeOperation='multiply'; offCtx.fillStyle=color; offCtx.fillRect(0,0,256,256); }
      if(tex){ offCtx.globalCompositeOperation='multiply'; offCtx.globalAlpha=0.55; offCtx.fillStyle=tex; offCtx.fillRect(0,0,256,256); offCtx.globalAlpha=1.0; }
      offCtx.globalCompositeOperation='destination-in'; offCtx.drawImage(img,0,0,256,256);
      ctx.globalCompositeOperation='source-over'; ctx.drawImage(offCanvas,0,0,256,256);
    }

    function getAvatarUrl(seedStr, genderStr) {
      const rng = new PRNG(seedStr || "guest"); const isF = (genderStr === 'Perempuan');
      const c = { skin: Math.floor(rng.next()*palettes.skin.length), bg: Math.floor(rng.next()*palettes.themes.length), bodyC: Math.floor(rng.next()*palettes.themes.length), hairC: Math.floor(rng.next()*palettes.themes.length), body: Math.floor(rng.next()*loadedParts.body.length||1), eye: isF?Math.floor(rng.next()*loadedParts.eyes_female.length||1):Math.floor(rng.next()*loadedParts.eyes_male.length||1), mouth: Math.floor(rng.next()*loadedParts.mouth.length||1), hairB: isF?Math.floor(rng.next()*loadedParts.hair_b.length||1):-1, hairF: isF?Math.floor(rng.next()*loadedParts.hair_f_female.length||1):Math.floor(rng.next()*loadedParts.hair_f_male.length||1), texF: Math.floor(rng.next()*29), texH: Math.floor(rng.next()*29) };
      ctx.clearRect(0,0,256,256); const sk = palettes.skin[c.skin]; const bT = palettes.themes[c.bg]; const bdT = palettes.themes[c.bodyC]; const hT = palettes.themes[c.hairC];
      const grd = ctx.createRadialGradient(128,128,0,128,128,200); grd.addColorStop(0,invertHexColor(bT.main)); grd.addColorStop(1,invertHexColor(bT.sec)); ctx.fillStyle=grd; ctx.fillRect(0,0,256,256);
      if(c.hairB!==-1) drawPart(loadedParts.hair_b[c.hairB], hT.hDark, loadedTextures[c.texH]); drawPart(loadedParts.head[0], sk.base); drawPart(loadedParts.body[c.body], bdT.main, loadedTextures[c.texF]);
      if(isF) drawPart(loadedParts.eyes_female[c.eye],"#ffffff"); else drawPart(loadedParts.eyes_male[c.eye],"#ffffff"); drawPart(loadedParts.mouth[c.mouth],"#ffffff");
      if(isF) drawPart(loadedParts.hair_f_female[c.hairF], hT.hair, loadedTextures[c.texH]); else drawPart(loadedParts.hair_f_male[c.hairF], hT.hair, loadedTextures[c.texH]);
      return canvas.toDataURL("image/png");
    }

    function resolveUserAvatar(userData) {
      if (!userData) return '';
      if (userData.customAvatar) return userData.customAvatar;
      return getAvatarUrl(userData.name, userData.gender);
    }

    document.getElementById('profile-pic-upload').addEventListener('change', function(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const compCanvas = document.createElement('canvas');
          compCanvas.width = 100; compCanvas.height = 100;
          const compCtx = compCanvas.getContext('2d');
          
          let sWidth = img.width; let sHeight = img.height;
          let sX = 0; let sY = 0;
          if (sWidth > sHeight) { sX = (sWidth - sHeight) / 2; sWidth = sHeight; } 
          else { sY = (sHeight - sWidth) / 2; sHeight = sWidth; }

          compCtx.drawImage(img, sX, sY, sWidth, sHeight, 0, 0, 100, 100);
          const compressedDataUrl = compCanvas.toDataURL('image/jpeg', 0.8);

          document.getElementById('profile-custom-avatar-url').value = compressedDataUrl;
          document.getElementById('profile-modal-preview').src = compressedDataUrl;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file); this.value = '';
    });

    document.getElementById('btn-reset-avatar').addEventListener('click', () => {
      document.getElementById('profile-custom-avatar-url').value = '';
      if(currentUserData) {
        document.getElementById('profile-modal-preview').src = getAvatarUrl(currentUserData.name, currentUserData.gender);
      }
    });

    document.getElementById('toggle-to-register').onclick = () => { document.getElementById('login-box').classList.add('hidden'); document.getElementById('register-box').classList.remove('hidden'); };
    document.getElementById('toggle-to-login').onclick = () => { document.getElementById('register-box').classList.add('hidden'); document.getElementById('login-box').classList.remove('hidden'); };
    
    document.getElementById('reg-name').addEventListener('input', (e) => {
      let cleanName = e.target.value.replace(/[^a-zA-Z0-9 ]/g, '').substring(0, 20); e.target.value = cleanName;
      if (!cleanName) { document.getElementById('reg-email').value = ''; return; }
      let hash = 0; for (let i = 0; i < cleanName.length; i++) hash += cleanName.charCodeAt(i);
      document.getElementById('reg-email').value = `${cleanName.replace(/\s/g,'').toLowerCase()}${(hash % 900) + 100}@main.com`;
    });

    document.getElementById('btn-register').addEventListener('click', async () => {
      const name = document.getElementById('reg-name').value.trim(); const gender = document.getElementById('reg-gender').value;
      const email = document.getElementById('reg-email').value; const pass = document.getElementById('reg-password').value;
      if (!name || pass.length < 6) { document.getElementById('reg-status').innerText = "Nama (Maks 20) & Pass min 6!"; return; }
      try {
        document.getElementById('reg-status').innerText = "Mendaftarkan...";
        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, "users", userCred.user.uid), { name, gender, email, friends: [], friendRequests: [], customAvatar: "", nameChangeCount: 0, lastChangeMonth: new Date().getMonth() });
      } catch (e) { document.getElementById('reg-status').innerText = e.message; }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      try { document.getElementById('login-status').innerText = "Masuk..."; await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); }
      catch (e) { document.getElementById('login-status').innerText = e.message; }
    });

    document.getElementById('btn-save-profile').addEventListener('click', async () => {
      const newName = document.getElementById('edit-name').value.trim().substring(0, 20); const newGender = document.getElementById('edit-gender').value;
      const customAvatarUrl = document.getElementById('profile-custom-avatar-url').value;
      let currentMonth = new Date().getMonth();
      let updates = { gender: newGender, dob: document.getElementById('edit-dob').value, location: document.getElementById('edit-location').value, bio: document.getElementById('edit-bio').value, customAvatar: customAvatarUrl };
      
      if (newName !== currentUserData.name) {
        let count = currentUserData.nameChangeCount || 0; let lastMonth = currentUserData.lastChangeMonth !== undefined ? currentUserData.lastChangeMonth : -1;
        if (lastMonth !== currentMonth) { updates.nameChangeCount = 1; updates.lastChangeMonth = currentMonth; updates.name = newName; }
        else { if (count >= 2) { customAlert("Batas ganti nama bulan ini habis (Maks 2x)!"); return; } updates.nameChangeCount = count + 1; updates.name = newName; }
      }
      try { 
        await updateDoc(doc(db, "users", currentUserData.uid), updates); 
        customAlert("Profil tersimpan!"); 
        document.getElementById('profile-modal').classList.add('hidden'); 
      }
      catch (e) { customAlert(e.message); }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        onSnapshot(doc(db, "users", user.uid), (docSnap) => {
          if (docSnap.exists()) { 
            currentUserData = docSnap.data(); currentUserData.uid = user.uid; 
            document.getElementById('current-user-avatar').src = resolveUserAvatar(currentUserData); 
            document.getElementById('profile-modal-preview').src = resolveUserAvatar(currentUserData);
            
            document.getElementById('edit-name').value = currentUserData.name; 
            
            const editGenderSelect = document.getElementById('edit-gender');
            editGenderSelect.value = currentUserData.gender;
            const genderTriggerSpan = editGenderSelect.previousSibling.querySelector('span');
            if(genderTriggerSpan) genderTriggerSpan.innerText = editGenderSelect.options[editGenderSelect.selectedIndex].text;
            
            document.getElementById('edit-dob').value = currentUserData.dob || ''; document.getElementById('edit-location').value = currentUserData.location || '';
            document.getElementById('edit-bio').value = currentUserData.bio || '';
            document.getElementById('profile-custom-avatar-url').value = currentUserData.customAvatar || '';
            
            document.getElementById('auth-modal').classList.add('hidden'); 
            renderResidentsAndFriendsUI(); 
          }
        });
        loadFeed();
      } else { currentUserData = null; document.getElementById('auth-modal').classList.remove('hidden'); }
    });

    window.openPublicProfile = function(uid) {
      if(uid === currentUserData.uid) {
        document.getElementById('profile-modal').classList.remove('hidden'); return;
      }
      const u = allUsersCache[uid]; if(!u) return;
      document.getElementById('pub-avatar').src = resolveUserAvatar(u);
      document.getElementById('pub-name').innerText = "@" + u.name;
      document.getElementById('pub-location').innerText = u.location ? ` ${u.location}` : "Lokasi Misterius";
      document.getElementById('pub-bio').innerText = u.bio ? `"${u.bio}"` : '"Pengguna ini terlalu malas menulis bio."';
      document.getElementById('public-profile-modal').classList.remove('hidden');
    }

    onSnapshot(collection(db, "users"), (snapshot) => { 
      allUsersCache = {};
      snapshot.forEach(doc => { allUsersCache[doc.id] = doc.data(); }); 
      renderResidentsAndFriendsUI(); 
      loadFeed(); 
    });
    
    window.addFriend = async function(targetUid) { 
      if(!targetUid || targetUid === currentUserData.uid) return; 
      try { 
        await updateDoc(doc(db, "users", targetUid), { friendRequests: arrayUnion(currentUserData.uid) }); 
        customAlert("Permintaan pertemanan sukses meluncur!"); 
      } catch(e) { customAlert("Gagal: " + e.message); } 
    };
    
    window.acceptFriend = async function(targetUid) {
      try {
        const newRequests = (currentUserData.friendRequests || []).filter(uid => uid !== targetUid); const newFriends = [...(currentUserData.friends || []), targetUid];
        await updateDoc(doc(db, "users", currentUserData.uid), { friendRequests: newRequests, friends: newFriends });
        const targetData = allUsersCache[targetUid]; if(targetData) { const targetNewFriends = [...(targetData.friends || []), currentUserData.uid]; await updateDoc(doc(db, "users", targetUid), { friends: targetNewFriends }); }
      } catch(e) { customAlert(e.message); }
    };
    
    function renderResidentsAndFriendsUI() {
      if(!currentUserData) return;
      const residentDiv = document.getElementById('all-residents-list');
      const reqDiv = document.getElementById('friend-requests-list'); 
      const friendDiv = document.getElementById('friends-list');
      const navBadge = document.getElementById('nav-badge-teman');

      let residentsHtml = '';
      for (const [uid, u] of Object.entries(allUsersCache)) {
        if (uid === currentUserData.uid) continue;
        const isAlreadyFriend = (currentUserData.friends || []).includes(uid);
        let actionBtn = isAlreadyFriend ? '<span style="font-size:11px; color:gray; font-weight:bold;">Teman</span>' : `<button class="small-btn success" onclick="addFriend('${uid}')">+ Teman</button>`;
        residentsHtml += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #e5e7eb;">
            <div style="display:flex; align-items:center; gap:8px; cursor:pointer;" onclick="openPublicProfile('${uid}')">
              <img src="${resolveUserAvatar(u)}" style="width:30px; height:30px; border-radius:8px; border:2px solid var(--border-color); object-fit:cover;">
              <b>@${u.name}</b>
            </div>
            ${actionBtn}
          </div>`;
      }
      residentDiv.innerHTML = residentsHtml || '<p style="font-size:13px; color:gray; margin:0;">Belum ada penghuni lain.</p>';

      const reqs = currentUserData.friendRequests || [];
      if(reqs.length > 0) {
        navBadge.innerText = reqs.length;
        navBadge.classList.remove('hidden');
      } else {
        navBadge.classList.add('hidden');
      }

      if(reqs.length === 0) reqDiv.innerHTML = '<p style="font-size:13px; color:gray; margin:0;">Belum ada yang ngajak temenan :(</p>';
      else reqDiv.innerHTML = reqs.map(uid => { const u = allUsersCache[uid]; if(!u) return ''; return `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #e5e7eb;"><b>@${u.name}</b> <button class="small-btn success" onclick="acceptFriend('${uid}')">Terima</button></div>`; }).join('');
      
      const friends = currentUserData.friends || [];
      if(friends.length === 0) friendDiv.innerHTML = '<p style="font-size:13px; color:gray; margin:0;">Buku pertemananmu masih kosong.</p>';
      else friendDiv.innerHTML = friends.map(uid => { const u = allUsersCache[uid]; return u ? `<div style="padding: 8px 0; border-bottom: 1px dashed #e5e7eb; cursor:pointer;" onclick="openPublicProfile('${uid}')"> @${u.name}</div>` : ''; }).join('');
    }

    document.getElementById('image-upload').addEventListener('change', function(e) {
      const file = e.target.files[0]; if (!file) return;
      const statusText = document.getElementById('upload-status');
      statusText.style.display = 'block'; statusText.innerText = 'Memproses gambar... '; statusText.style.color = 'var(--text-secondary)';

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width; let height = img.height;
          const MAX_SIZE = 800;
          if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }

          canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          
          document.getElementById('post-image-url').value = dataUrl;
          document.getElementById('compose-preview-img').src = dataUrl;
          document.getElementById('compose-preview-area').style.display = 'block';
          
          statusText.innerText = 'Gambar siap! '; statusText.style.color = '#10b981';
          setTimeout(() => { statusText.style.display = 'none'; }, 2000);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file); this.value = ''; 
    });

    document.getElementById('btn-remove-img').addEventListener('click', () => {
      document.getElementById('post-image-url').value = '';
      document.getElementById('compose-preview-img').src = '';
      document.getElementById('compose-preview-area').style.display = 'none';
    });

    window.openLightbox = function(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    document.getElementById('btn-post').addEventListener('click', async () => {
      const input = document.getElementById('post-input'); const text = input.value.trim();
      const imgInput = document.getElementById('post-image-url'); const imgUrl = imgInput.value.trim();
      if (!text && !imgUrl) return;
      
      const btn = document.getElementById('btn-post'); btn.disabled = true; btn.innerText = "Mengirim...";
      try {
        await addDoc(collection(db, "posts"), {
          content: text, imageUrl: imgUrl, authorUid: currentUserData.uid, authorName: currentUserData.name,
          authorGender: currentUserData.gender, reactions: { like: [], meh: [], wuttafak: [] }, comments: [], createdAt: serverTimestamp()
        });
        input.value = ''; imgInput.value = ''; document.getElementById('compose-preview-img').src = ''; document.getElementById('compose-preview-area').style.display = 'none';
      } catch (e) { customAlert(e.message); } finally { btn.disabled = false; btn.innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> Posting Sekarang`; }
    });

    window.promptEditPost = function(postId) {
      const post = window.postsCache[postId]; if(!post) return;
      document.getElementById('edit-post-id').value = postId;
      document.getElementById('edit-post-content').value = post.content;
      document.getElementById('edit-post-modal').classList.remove('hidden');
    };

    document.getElementById('btn-save-edit-post').addEventListener('click', async () => {
      const postId = document.getElementById('edit-post-id').value;
      const newContent = document.getElementById('edit-post-content').value.trim();
      try {
        await updateDoc(doc(db, "posts", postId), { content: newContent });
        document.getElementById('edit-post-modal').classList.add('hidden');
      } catch (e) { customAlert("Gagal mengedit: " + e.message); }
    });

    window.deletePost = async function(postId) {
      const isConfirmed = await window.customConfirm('Yakin ingin menghapus jejak digital ini selamanya?');
      if (!isConfirmed) return;
      try { await deleteDoc(doc(db, "posts", postId)); } catch(e) { customAlert("Gagal menghapus postingan: " + e.message); }
    };

    window.toggleReaction = async function(postId, type) {
      const userId = currentUserData.uid; const post = window.postsCache[postId]; if (!post) return;
      let reactions = { ...post.reactions }; ['like', 'meh', 'wuttafak'].forEach(t => { if(!reactions[t]) reactions[t] = []; });
      const hasReacted = reactions[type].includes(userId);
      ['like', 'meh', 'wuttafak'].forEach(t => { reactions[t] = reactions[t].filter(id => id !== userId); });
      if (!hasReacted) reactions[type].push(userId);
      await updateDoc(doc(db, "posts", postId), { reactions });
    };

    window.sharePost = function(postId) {
      const postElement = document.getElementById(`post-${postId}`);
      if (!postElement) return;

      const shareBtn = postElement.querySelector('.btn-share');
      const originalBtnHtml = shareBtn.innerHTML;
      shareBtn.innerHTML = ' ';

      const watermark = document.createElement('div');
      watermark.innerText = 'iNviNiv';
      watermark.style.position = 'absolute';
      watermark.style.top = '12px';
      watermark.style.right = '16px';
      watermark.style.fontWeight = '800';
      watermark.style.color = '#38BDF8';
      watermark.style.fontSize = '14px';
      watermark.style.textShadow = '1px 1px 0px #1e1e1e';
      watermark.style.opacity = '0.8';
      watermark.style.fontFamily = "'FontUtama', sans-serif";
      watermark.style.zIndex = '10';
      
      const originalPosition = postElement.style.position;
      postElement.style.position = 'relative';
      postElement.appendChild(watermark);

      html2canvas(postElement, {
        useCORS: true,
        scale: 2,
        backgroundColor: '#ffffff' 
      }).then(canvas => {
        postElement.removeChild(watermark);
        postElement.style.position = originalPosition;
        shareBtn.innerHTML = originalBtnHtml;

        const imageData = canvas.toDataURL('image/jpeg', 0.9);
        const downloadLink = document.createElement('a');
        downloadLink.href = imageData;
        downloadLink.download = `iNviNiv_Post_${postId}.jpg`;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      }).catch(err => {
        console.error("Gagal membuat gambar postingan:", err);
        customAlert("Oops! Gagal membuat gambar postingan.");
        postElement.removeChild(watermark);
        postElement.style.position = originalPosition;
        shareBtn.innerHTML = originalBtnHtml;
      });
    };

    window.prepareReply = function(postId, commentId, authorName) {
      const inputEl = document.getElementById(`comment-input-${postId}`);
      inputEl.dataset.replyTo = commentId; inputEl.placeholder = `Membalas @${authorName}...`; inputEl.focus();
    };

    window.sendComment = async function(postId) {
      const inputEl = document.getElementById(`comment-input-${postId}`); const text = inputEl.value.trim(); if (!text) return;
      const replyToId = inputEl.dataset.replyTo || null;
      const newComment = { id: Date.now().toString() + Math.random().toString(36).substr(2, 5), authorUid: currentUserData.uid, authorName: currentUserData.name, content: text, createdAt: Date.now(), replyTo: replyToId };
      await updateDoc(doc(db, "posts", postId), { comments: arrayUnion(newComment) });
      inputEl.value = ''; inputEl.dataset.replyTo = ''; inputEl.placeholder = 'Tulis komentar balasan...';
    };

    window.deleteComment = async function(postId, commentId) {
      const isConfirmed = await window.customConfirm('Hapus komentar ini?');
      if (!isConfirmed) return;
      try {
        const postRef = doc(db, "posts", postId); const postSnap = await getDoc(postRef);
        if (postSnap.exists()) {
          const postData = postSnap.data(); const updatedComments = postData.comments.filter(c => c.id !== commentId && c.replyTo !== commentId);
          await updateDoc(postRef, { comments: updatedComments });
        }
      } catch(e) { customAlert("Gagal: " + e.message); }
    };

    window.handleFeedFilterChange = function() {
      currentFeedFilter = document.getElementById('feed-filter-select').value;
      loadFeed();
    }

    function loadFeed() {
      onSnapshot(query(collection(db, "posts")), (snapshot) => {
        const feedDiv = document.getElementById('feed-container');
        if (snapshot.empty) { feedDiv.innerHTML = '<p style="text-align: center; color: gray;">Krik krik... belum ada postingan. Jadilah yang pertama!</p>'; return; }
        
        let postsArray = [];
        snapshot.forEach(docSnap => { const data = docSnap.data(); window.postsCache[docSnap.id] = data; postsArray.push({ id: docSnap.id, ...data }); });

        if (currentFeedFilter === 'friends') {
          const myFriends = currentUserData?.friends || [];
          postsArray = postsArray.filter(p => p.authorUid === currentUserData.uid || myFriends.includes(p.authorUid));
        } else if (currentFeedFilter === 'public') {
          postsArray = postsArray.filter(p => p.authorUid !== currentUserData.uid);
        }

        postsArray.sort((a, b) => {
          const aTime = a.createdAt?.toMillis() || 0; const bTime = b.createdAt?.toMillis() || 0;
          const aLikes = a.reactions?.like?.length || 0; const bLikes = b.reactions?.like?.length || 0;
          const aMehs = a.reactions?.meh?.length || 0; const bMehs = b.reactions?.meh?.length || 0;
          const aWuttafaks = a.reactions?.wuttafak?.length || 0; const bWuttafaks = b.reactions?.wuttafak?.length || 0;

          if (currentFeedFilter === 'newest') return bTime - aTime;
          if (currentFeedFilter === 'oldest') return aTime - bTime;
          if (currentFeedFilter === 'most_like') return bLikes - aLikes;
          if (currentFeedFilter === 'most_meh') return bMehs - aMehs;
          if (currentFeedFilter === 'most_wuttafak') return bWuttafaks - aWuttafaks;
          return bTime - aTime;
        });

        if (postsArray.length === 0) {
          feedDiv.innerHTML = '<p style="text-align: center; color: gray;">Tidak ada postingan dalam filter ini.</p>';
          return;
        }

        feedDiv.innerHTML = '';
        postsArray.forEach(post => {
          const postId = post.id;
          const timeStr = timeAgo(post.createdAt);
          const currentAuthorData = allUsersCache[post.authorUid];
          const displayNama = currentAuthorData ? currentAuthorData.name : post.authorName;
          const avatarSrc = resolveUserAvatar(currentAuthorData || { name: post.authorName, gender: post.authorGender });
          const rx = post.reactions || { like: [], meh: [], wuttafak: [] };
          const uid = currentUserData.uid;
          const isMyPost = post.authorUid === uid;

          let imageHtml = (post.imageUrl && post.imageUrl.trim() !== '') ? `<img src="${post.imageUrl}" class="post-image-preview" alt="Gambar" onclick="openLightbox('${post.imageUrl}')">` : '';
          
          let postMenuHtml = '';
          if (isMyPost) {
            postMenuHtml = `
              <div class="post-menu">
                <button class="post-menu-btn" onclick="promptEditPost('${postId}')"> Edit</button>
                <button class="post-menu-btn btn-delete-post" onclick="deletePost('${postId}')"> Hapus</button>
              </div>`;
          }

          let friendBtnHtml = '';
          if (!isMyPost) {
            const myFriends = currentUserData.friends || [];
            const isFriend = myFriends.includes(post.authorUid);
            const authorReqs = currentAuthorData?.friendRequests || [];
            if (!isFriend && !authorReqs.includes(uid)) { friendBtnHtml = `<span class="add-friend-btn" onclick="addFriend('${post.authorUid}'); event.stopPropagation();">+ Tambah Teman</span>`; }
            else if(authorReqs.includes(uid)) { friendBtnHtml = `<span class="add-friend-btn" style="background:#e5e7eb; color:#6b7280; border-color:#9ca3af;">Menunggu...</span>`; }
          }

          const allComments = post.comments || [];
          const mainComments = allComments.filter(c => !c.replyTo);
          const replies = allComments.filter(c => c.replyTo);
          let commentsHtml = '';
          
          mainComments.forEach(mc => {
            let delBtn = (mc.authorUid === uid || isMyPost) ? `<button class="delete-comment-btn" onclick="deleteComment('${postId}', '${mc.id}')">Hapus</button>` : '';
            commentsHtml += `
              <div class="comment-item">
                <div class="comment-bubble">
                  <span class="comment-header" style="cursor:pointer;" onclick="openPublicProfile('${mc.authorUid}')">@${mc.authorName}</span>
                  ${mc.content}
                </div>
                <div class="comment-actions">
                  <button class="reply-btn-text" onclick="prepareReply('${postId}', '${mc.id}', '${mc.authorName}')">Balas</button>
                  ${delBtn}
                </div>
              </div>`;
            
            replies.filter(r => r.replyTo === mc.id).forEach(tr => {
              let rDelBtn = (tr.authorUid === uid || isMyPost) ? `<button class="delete-comment-btn" onclick="deleteComment('${postId}', '${tr.id}')">Hapus</button>` : '';
              commentsHtml += `
                <div class="comment-item is-reply">
                  <div class="comment-bubble">
                    <span class="comment-header" style="cursor:pointer;" onclick="openPublicProfile('${tr.authorUid}')">@${tr.authorName}</span>
                    ${tr.content}
                  </div>
                  <div class="comment-actions">
                    <button class="reply-btn-text" onclick="prepareReply('${postId}', '${mc.id}', '${tr.authorName}')">Balas</button>
                    ${rDelBtn}
                  </div>
                </div>`;
            });
          });

          const postEl = document.createElement('div');
          postEl.className = 'post-card';
          postEl.id = `post-${postId}`;
          postEl.innerHTML = `
            <div class="post-top">
              <img src="${avatarSrc}" class="post-avatar" alt="Avatar" onclick="openPublicProfile('${post.authorUid}')">
              <div class="post-content">
                <div class="post-header">
                  <div class="post-name-area" onclick="openPublicProfile('${post.authorUid}')">
                    <span class="post-name">@${displayNama}</span>
                    <span class="post-time">${timeStr}</span>
                    ${friendBtnHtml}
                  </div>
                  ${postMenuHtml}
                </div>
                
                <div class="post-text">${post.content}</div>
                ${imageHtml}
                
                <div class="action-bar">
                  <div class="reaction-group">
                    <button class="reaction-btn btn-react-like ${rx.like?.includes(uid) ? 'active' : ''}" onclick="toggleReaction('${postId}', 'like')">
                      <img src="like.png" class="reaction-icon-img" alt="Like"> ${rx.like?.length || 0}
                    </button>
                    <button class="reaction-btn btn-react-meh ${rx.meh?.includes(uid) ? 'active' : ''}" onclick="toggleReaction('${postId}', 'meh')">
                      <img src="meh.png" class="reaction-icon-img" alt="Meh"> ${rx.meh?.length || 0}
                    </button>
                    <button class="reaction-btn btn-react-wuttafak ${rx.wuttafak?.includes(uid) ? 'active' : ''}" onclick="toggleReaction('${postId}', 'wuttafak')">
                      <img src="wuttafak.png" class="reaction-icon-img" alt="Wuttafak"> ${rx.wuttafak?.length || 0}
                    </button>
                  </div>
                  <button class="reaction-btn btn-share" onclick="sharePost('${postId}')">${SVGs.share}</button>
                </div>
                
                <div class="comments-section">
                  <div class="comments-list-wrapper">
                    ${commentsHtml || '<div style="font-size:13px; color:gray; font-style:italic;">Belum ada komentar...</div>'}
                  </div>
                  <div class="comment-input-box">
                    <input type="text" id="comment-input-${postId}" placeholder="Tulis komentar balasan..." data-reply-to="">
                    <button class="primary" onclick="sendComment('${postId}')">Kirim</button>
                  </div>
                </div>
              </div>
            </div>`;
          feedDiv.appendChild(postEl);
        });
      });
    }

    window.onload = initGenerator;
  </script>
</body>
</html>
